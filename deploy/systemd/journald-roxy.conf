# journald-roxy.conf: journal size and age limits for the Roxy server (plan 17.6).
#
# Installed as /etc/systemd/journald.conf.d/roxy.conf (a drop-in, so the distro's journald.conf stays untouched),
# then `systemctl restart systemd-journald`. Roxy logs structured JSON lines to the journal (no app log files), so
# the journal is the log store and needs explicit bounds.

[Journal]
# At most 2 GB of journal on disk; the oldest entries go first when it is full.
SystemMaxUse=2G
# Keep at least 1 GB of the disk free whatever SystemMaxUse says (the databases and backups share this disk).
SystemKeepFree=1G
# Delete entries older than 30 days even when there is room.
MaxRetentionSec=30day
# Compress large entries (journald's default, stated so the size estimate above holds).
Compress=yes
