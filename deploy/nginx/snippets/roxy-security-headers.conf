# roxy-security-headers.conf: headers nginx adds to every Roxy response (plan 9.1, 17.2).
#
# Installed as /etc/nginx/snippets/roxy-security-headers.conf by roxy-nginx-apply. It is included in the main
# server block AND in every location that declares its own add_header: nginx drops ALL inherited add_header
# directives in a location that has any add_header of its own, so without the include HSTS would silently vanish
# on /static/ (health check H-NGINX asserts HSTS on a static asset). The app sends its other security headers
# itself (CSP with nonces, X-Frame-Options, and the rest, plan 9.2 and 9.3) and leaves HSTS to nginx
# (ROXY_SEND_HSTS=0), so no header is ever sent twice.

# Browsers use HTTPS only for this host and its subdomains for two years. No `preload` (owner decision D21: the
# preload list covers every subdomain and takes months to undo). `always` adds it to error responses too.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
