# roxy-upstream-blue.conf: send Roxy traffic to the BLUE color (plan 17.2, 17.4).
#
# Installed as /etc/nginx/roxy-upstream-blue.conf. /etc/nginx/roxy-active-upstream.conf is a symlink to this file
# or to roxy-upstream-green.conf, and roxy-switch-color repoints it, tests the config and reloads nginx: nginx
# finishes the old color's connections and sends new ones here, with zero downtime.
# The site config includes the symlink at http level, so this file holds the whole upstream block and the
# variable naming the active color. Both must switch together (the static files are served from the active
# color's release), and one symlink switches both in one reload. roxy-upstream-green.conf differs only in the
# port and the color name.

# The pool nginx proxies to (proxy_pass http://roxy_app in the site config).
upstream roxy_app {
    # Blue's gunicorn on loopback (ROXY_BIND in /etc/roxy/blue.env). With a single server nginx never marks it
    # down, so a brief error never turns into "no live upstreams".
    server 127.0.0.1:8001;
    # Keep up to 64 idle connections to the app per nginx worker, so requests skip the TCP handshake (v1 set
    # proxy_http_version 1.1 but had no upstream block, so it never reused a connection).
    keepalive 64;
    # Close an idle upstream connection after 60 s. The app keeps idle connections for 75 s (timeout_keep_alive
    # in roxy/worker.py); this value must stay BELOW the app's, or nginx could reuse a socket the app already
    # closed and callers would see intermittent 502s.
    keepalive_timeout 60s;
    # Recycle each upstream connection after 1000 requests, matching the client-side keepalive_requests.
    keepalive_requests 1000;
}

# The active color as a variable, for the /static/ root (/opt/roxy/releases/current-blue/...). A map with a
# default and no entries is how nginx spells a constant.
map $host $roxy_active_color {
    default blue;
}
