format: roxy.health_fixture/1
check: H-SECRETS-PERMS
case: pass
name: as_expected
description: >
  The root audit (roxy-audit.service) wrote perms.json 2 hours ago and every path has its expected mode. 13.2
  H-SECRETS-PERMS: as expected and a result under 7 h old gives pass. The file holds only paths, modes and
  verdicts, never the audited contents. The variant is the age edge: a result 6 h 50 min old still passes.
now: "2026-10-07T15:00:00Z"
inputs:
  files:
    "{state_dir}/audit/perms.json":
      mode: "0640"
      age: "-2h"
      json:
        checked_at: "-2h"
        results:
          - {path: "/etc/roxy/credentials", mode: "0700", expected: "0700", secret: true}
          - {path: "/etc/roxy/credentials/roblox_credential", mode: "0600", expected: "0600", secret: true}
          - {path: "/etc/roxy/credentials/rotator_url", mode: "0600", expected: "0600", secret: true}
          - {path: "/etc/roxy/credentials/credential_encryption_key", mode: "0600", expected: "0600", secret: true}
          - {path: "/etc/roxy/credentials/totp_encryption_key", mode: "0600", expected: "0600", secret: true}
          - {path: "/var/backups/roxy", mode: "0700", expected: "0700", secret: true}
          - {path: "/etc/roxy/roxy.env", mode: "0640", expected: "0640", secret: false}
          - {path: "/etc/roxy/blue.env", mode: "0640", expected: "0640", secret: false}
          - {path: "/var/lib/roxy/control.db", mode: "0640", expected: "0640", secret: false}
          - {path: "/var/lib/roxy/metrics.db", mode: "0640", expected: "0640", secret: false}
