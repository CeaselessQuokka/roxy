format: roxy.health_fixture/1
check: H-SECRETS-PERMS
case: warn
name: non_secret_loose
description: >
  A fresh audit result (2 hours old) shows /etc/roxy/roxy.env at 0644 instead of 0640. roxy.env holds no
  secrets (9.8), so this is looser on a non-secret: 13.2 H-SECRETS-PERMS gives warn. Every secret path is as
  expected. The variant has every mode right but a result 7 h 10 min old (the 6 hourly timer stopped): a stale
  result also warns.
now: "2026-10-07T15:00:00Z"
inputs:
  files:
    "{state_dir}/audit/perms.json":
      mode: "0640"
      age: "-2h"
      json:
        checked_at: "-2h"
        results:
          - {path: "/etc/roxy/credentials", mode: "0700", expected: "0700", secret: true}
          - {path: "/etc/roxy/credentials/roblox_credential", mode: "0600", expected: "0600", secret: true}
          - {path: "/etc/roxy/credentials/rotator_url", mode: "0600", expected: "0600", secret: true}
          - {path: "/var/backups/roxy", mode: "0700", expected: "0700", secret: true}
          - {path: "/etc/roxy/roxy.env", mode: "0644", expected: "0640", secret: false}
          - {path: "/etc/roxy/blue.env", mode: "0640", expected: "0640", secret: false}
          - {path: "/var/lib/roxy/control.db", mode: "0640", expected: "0640", secret: false}
expect:
  status: warn
  explanation: {present: true}
  fix_link: {present: true}
  credential_calls: {eq: 0}
variants:
  - case: warn
    name: stale_result_7h10m
    inputs:
      files:
        "{state_dir}/audit/perms.json":
          age: "-430m"
          json:
            checked_at: "-430m"
            results:
              - {path: "/etc/roxy/credentials", mode: "0700", expected: "0700", secret: true}
              - {path: "/etc/roxy/credentials/roblox_credential", mode: "0600", expected: "0600", secret: true}
              - {path: "/etc/roxy/credentials/rotator_url", mode: "0600", expected: "0600", secret: true}
              - {path: "/var/backups/roxy", mode: "0700", expected: "0700", secret: true}
              - {path: "/etc/roxy/roxy.env", mode: "0640", expected: "0640", secret: false}
              - {path: "/etc/roxy/blue.env", mode: "0640", expected: "0640", secret: false}
              - {path: "/var/lib/roxy/control.db", mode: "0640", expected: "0640", secret: false}
    expect:
      status: warn
      explanation: {present: true}
