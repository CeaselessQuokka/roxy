format: roxy.health_fixture/1
check: H-DB-SIZE
case: warn
name: 85_percent_of_budget
description: >
  metrics.db grew to 9.6 GB: the databases hold 10.17 GB against a 12 GB budget, 85% (79% if a GB is 2^30
  bytes). 13.2 H-DB-SIZE: under 90% (and not under 70%) gives warn, with the Data page as the fix. The variant
  raises storage_total_budget_gb to 20 (the owner has the disk): 51% of the new budget passes.
now: "2026-10-07T15:00:00Z"
inputs:
  settings:
    storage_total_budget_gb: 12
  state:
    disk:
      total_bytes: 40000000000
      free_bytes: 18000000000
      files:
        "control.db": {bytes: 60000000, wal_bytes: 4194304}
        "hot.db": {bytes: 8000000, wal_bytes: 4194304}
        "metrics.db": {bytes: 9600000000, wal_bytes: 4194304}
        "cache.db": {bytes: 500000000, wal_bytes: 4194304}
expect:
  status: warn
  explanation: {present: true}
  fix_link: {regex: "(?i)data"}
  credential_calls: {eq: 0}
variants:
  - case: pass
    name: budget_raised_to_20
    inputs:
      settings:
        storage_total_budget_gb: 20
    expect:
      status: pass
