format: roxy.health_fixture/1
check: H-E2E
case: warn
name: cache_did_not_transition
description: >
  Both public requests succeed with every expected header, but both are MISS: the first answer was not cached
  (for example a cache rule that stopped matching, or cache.db not writable). 13.2 H-E2E: cache did not
  transition gives warn, with the Cache page and the ops docs as the fix.
now: "2026-10-07T15:00:00Z"
inputs:
  upstream:
    "origin:/games.roblox.com/v1/games?*":
      - status: 200
        headers:
          content-type: "application/json; charset=utf-8"
          roxy-cache: "MISS"
          roxy-request-id: "01K72Q8M3V5X7Z9B1D3F5H7J9K"
          strict-transport-security: "max-age=63072000; includeSubDomains"
          x-content-type-options: "nosniff"
          x-frame-options: "DENY"
          referrer-policy: "no-referrer"
          cross-origin-opener-policy: "same-origin"
          permissions-policy: "camera=(), microphone=(), geolocation=(), usb=(), payment=()"
        json: {data: [{id: 1, rootPlaceId: 2, name: "Fixture Experience", playing: 12}]}
        latency_ms: 240
      - status: 200
        headers:
          content-type: "application/json; charset=utf-8"
          roxy-cache: "MISS"
          roxy-request-id: "01K72Q8M3V5X7Z9B1D3F5H7J9M"
          strict-transport-security: "max-age=63072000; includeSubDomains"
          x-content-type-options: "nosniff"
          x-frame-options: "DENY"
          referrer-policy: "no-referrer"
          cross-origin-opener-policy: "same-origin"
          permissions-policy: "camera=(), microphone=(), geolocation=(), usb=(), payment=()"
        json: {data: [{id: 1, rootPlaceId: 2, name: "Fixture Experience", playing: 12}]}
        latency_ms: 230
expect:
  status: warn
  value: {regex: "(?i)miss"}
  explanation: {present: true}
  fix_link: {present: true}
  calls:
    "origin:/games.roblox.com/v1/games?*": {count: 2}
  credential_calls: {eq: 0}
