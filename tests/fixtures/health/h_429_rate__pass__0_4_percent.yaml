format: roxy.health_fixture/1
check: H-429-RATE
case: pass
name: 0_4_percent
description: >
  In the last 15 minutes Roxy made 3,000 upstream calls and Roblox answered 12 of them with 429 (0.4%, served
  stale to the callers). 13.2 H-429-RATE: under 0.5% of upstream calls gives pass. The 45 minutes before had a
  3% rate (270 of 9,000) and must not count. Cache hits make no upstream call, so they are not in the
  denominator; even if they were, the rate would only fall.
now: "2026-10-07T15:00:00Z"
inputs:
  traffic_defaults:
    clients: {cidr: "203.0.113.0/26", count: 40}
    user_agent: "Roblox/Linux"
  profiles:
    hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: 4}
    miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", upstream_calls: 1, latency_ms: {p50: 150, p95: 400, p99: 700}}
    stale_after_429:
      egress: direct
      outcome: served_cache
      reason: cache_stale_error
      status: 200
      source: cache
      cache_state: "STALE"
      upstream_calls: 1
      upstream_status: 429
      error: true
      latency_ms: 90
      upstream_429: {egress: direct, retry_after_s: 30}
  traffic:
    - {name: games_hit, profile: hit, endpoint_template: games.roblox.com/v1/games, window: ["-15m", "0m"], total: 2000}
    - {name: games_miss, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-15m", "0m"], total: 1500}
    - {name: headshot_miss, profile: miss, endpoint_template: thumbnails.roblox.com/v1/users/avatar-headshot, window: ["-15m", "0m"], total: 1488}
    - {name: catalog_429, profile: stale_after_429, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-15m", "0m"], total: 12}
    - {name: games_hit_earlier, profile: hit, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "-15m"], total: 6000}
    - {name: games_miss_earlier, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "-15m"], total: 8730}
    - {name: catalog_429_earlier, profile: stale_after_429, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-60m", "-15m"], total: 270}
expect:
  data_checks:
    - window: ["-15m", "0m"]
      requests: 5000
      upstream_calls: 3000
      roblox_429: 12
    - window: ["-60m", "-15m"]
      upstream_calls: 9000
      roblox_429: 270
  status: pass
  value: {lt: 0.5}
  credential_calls: {eq: 0}
