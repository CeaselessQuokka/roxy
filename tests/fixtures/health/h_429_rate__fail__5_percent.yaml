format: roxy.health_fixture/1
check: H-429-RATE
case: fail
name: 5_percent
description: >
  In the last 15 minutes Roblox answered 150 of 3,000 upstream calls with 429 (5%): 100 were served stale and
  50 callers got Roxy's own 429 with Retry-After (no stale copy). 13.2 H-429-RATE: 2% or more gives fail.
  Measured against all 5,000 requests it would be 3%, still a failure.
now: "2026-10-07T15:00:00Z"
inputs:
  traffic_defaults:
    clients: {cidr: "203.0.113.0/26", count: 40}
    user_agent: "Roblox/Linux"
  profiles:
    hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: 4}
    miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", upstream_calls: 1, latency_ms: {p50: 150, p95: 400, p99: 700}}
    stale_after_429:
      egress: direct
      outcome: served_cache
      reason: cache_stale_error
      status: 200
      source: cache
      cache_state: "STALE"
      upstream_calls: 1
      upstream_status: 429
      error: true
      latency_ms: 90
      upstream_429: {egress: direct, retry_after_s: 30}
    cooldown_no_stale:
      egress: direct
      outcome: failed
      reason: upstream_cooldown
      status: 429
      source: roxy
      cache_state: "MISS"
      upstream_calls: 1
      upstream_status: 429
      error: true
      latency_ms: 85
      upstream_429: {egress: direct, retry_after_s: 30}
  traffic:
    - {name: games_hit, profile: hit, endpoint_template: games.roblox.com/v1/games, window: ["-15m", "0m"], total: 2000}
    - {name: games_miss, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-15m", "0m"], total: 1500}
    - {name: headshot_miss, profile: miss, endpoint_template: thumbnails.roblox.com/v1/users/avatar-headshot, window: ["-15m", "0m"], total: 1350}
    - {name: catalog_429_stale, profile: stale_after_429, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-15m", "0m"], total: 100}
    - {name: catalog_429_no_stale, profile: cooldown_no_stale, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-15m", "0m"], total: 50}
expect:
  data_checks:
    - window: ["-15m", "0m"]
      requests: 5000
      upstream_calls: 3000
      roblox_429: 150
  status: fail
  value: {gte: 2}
  explanation: {present: true}
  fix_link: {regex: "(?i)recommendation"}
  credential_calls: {eq: 0}
