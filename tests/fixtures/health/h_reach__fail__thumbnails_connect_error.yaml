format: roxy.health_fixture/1
check: H-REACH-<host>
params: {host: thumbnails.roblox.com}
case: fail
name: thumbnails_connect_error
description: >
  The connection to thumbnails.roblox.com is refused. 13.2 H-REACH: failure gives fail. A connect error may be
  retried once under the 7.9 policy.
now: "2026-10-07T15:00:00Z"
inputs:
  upstream:
    "probe:thumbnails.roblox.com": {error: connect}
expect:
  status: fail
  value: {present: true}
  explanation: {present: true}
  fix_link: {regex: "(?i)upstream"}
  calls:
    "probe:thumbnails.roblox.com": {count: {between: [1, 2]}}
  credential_calls: {eq: 0}
