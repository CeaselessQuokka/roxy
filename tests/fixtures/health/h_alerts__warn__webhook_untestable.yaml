format: roxy.health_fixture/1
check: H-ALERTS
case: warn
name: webhook_untestable
description: >
  SMTP is fine, but the webhook belongs to a provider that cannot be tested without posting a message. 13.2
  H-ALERTS marks it "not testable without sending", which gives warn (the Settings > Alerts card offers "Send
  test alert" instead). The variant has a testable Discord webhook that answers, but SMTP refuses the login: one
  channel down also gives warn.
now: "2026-10-07T15:00:00Z"
inputs:
  settings:
    alert_webhook_enabled: 1
  alerts:
    smtp: {connect: ok, login: ok, noop: ok}
    webhooks:
      - {provider: other}
expect:
  status: warn
  explanation: {present: true}
  fix_link: {regex: "(?i)alert"}
  credential_calls: {eq: 0}
variants:
  - case: warn
    name: smtp_login_refused
    inputs:
      alerts:
        smtp: {connect: ok, login: refused, noop: ok}
        webhooks:
          - {provider: discord, get_status: 200}
    expect:
      status: warn
      explanation: {present: true}
      fix_link: {regex: "(?i)alert"}
