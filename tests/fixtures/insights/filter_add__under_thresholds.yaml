# FILTER-ADD just under its thresholds (1,000 refusals per hour, 3 hours).
#
#   client         refused per hour (11:00, 12:00, 13:00, 14:00 UTC)   why it does not qualify
#   192.0.2.160    990     990     990     990                         under 1,000 in every hour, for four hours
#   192.0.2.161    0       1,200   1,200   240                         over 1,000 for two hours, then down to 240
#
# 192.0.2.161 also stays under when "1,000 per hour for 3 hours" is read as an average over the three hours (2,640
# in three hours), and under 900 per hour on average too, which keeps the variant below unambiguous.
#
# Each hour has its own generator so every clock hour holds exactly the stated count (a single `total` over four
# hours would put 17 in some minutes and 16 in others and make some hours 1,020). Both clients also get their 12
# requests per minute served.

format: roxy.insight_fixture/1
rule: FILTER-ADD
case: under_thresholds
description: >
  One client is refused 990 times in each of four hours and another was refused 1,200 times an hour for two hours
  before dropping to 240. Neither is over 1,000 for three consecutive hours, so FILTER-ADD must not fire.
now: "2026-10-07T15:00:00Z"

traffic_defaults:
  auth_class: anon
  bypass: false
  error: false

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", upstream_calls: 0, latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", upstream_calls: 1, latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1800, upstream_in: 1900, upstream_out: 420}}
  throttled: {egress: none, outcome: refused, reason: throttle, status: 429, source: roxy, cache_state: "NA", upstream_calls: 0, latency_ms: 1, bytes: {caller_in: 0, caller_out: 90}}
  legit:
    clients: {cidr: "203.0.113.0/26", count: 40}
    places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]
    user_agent: "Roblox/Linux"
  c160: {client_ip: "192.0.2.160", user_agent: "curl/8.5.0", endpoint_template: "users.roblox.com/v1/users/{userId}"}
  c161: {client_ip: "192.0.2.161", user_agent: "Go-http-client/1.1", endpoint_template: "catalog.roblox.com/v1/search/items"}

traffic:
  - {name: legit_hit, profile: [hit, legit], endpoint_template: games.roblox.com/v1/games, window: ["-240m", "0m"], per_minute: 30}
  - {name: legit_miss, profile: [miss, legit], endpoint_template: games.roblox.com/v1/games, window: ["-240m", "0m"], per_minute: 8}
  - {name: c160_served, profile: [miss, c160], window: ["-240m", "0m"], per_minute: 12}
  - {name: c160_throttled_h1, profile: [throttled, c160], window: ["-240m", "-180m"], total: 990}
  - {name: c160_throttled_h2, profile: [throttled, c160], window: ["-180m", "-120m"], total: 990}
  - {name: c160_throttled_h3, profile: [throttled, c160], window: ["-120m", "-60m"], total: 990}
  - {name: c160_throttled_h4, profile: [throttled, c160], window: ["-60m", "0m"], total: 990}
  - {name: c161_served, profile: [miss, c161], window: ["-180m", "0m"], per_minute: 12}
  - {name: c161_throttled_high, profile: [throttled, c161], window: ["-180m", "-60m"], per_minute: 20}
  - {name: c161_throttled_low, profile: [throttled, c161], window: ["-60m", "0m"], per_minute: 4}

state:
  client_scores:
    - {ip: "192.0.2.160", bot_score: 71}
    - {ip: "192.0.2.161", bot_score: 66}
    - {clients: {cidr: "203.0.113.0/26", count: 40}, bot_score: 8}

expect:
  data_checks:
    - {window: ["-240m", "-180m"], where: {client_ip: "192.0.2.160"}, refused: 990}
    - {window: ["-180m", "-120m"], where: {client_ip: "192.0.2.160"}, refused: 990}
    - {window: ["-120m", "-60m"], where: {client_ip: "192.0.2.160"}, refused: 990}
    - {window: ["-60m", "0m"], where: {client_ip: "192.0.2.160"}, refused: 990}
    - {window: ["-180m", "-120m"], where: {client_ip: "192.0.2.161"}, refused: 1200}
    - {window: ["-120m", "-60m"], where: {client_ip: "192.0.2.161"}, refused: 1200}
    - {window: ["-60m", "0m"], where: {client_ip: "192.0.2.161"}, refused: 240}
  fires: false

variants:
  - case: refusals_threshold_lowered
    description: At 900 refusals per hour, 192.0.2.160 (990 per hour for four hours) qualifies; 192.0.2.161 still has only two hours over.
    settings: {insight_filter_add_refusals_per_hour: 900}
    expect:
      fires: true
      others: forbid
      recommendations:
        - {subject_contains: "192.0.2.160", severity: any}
