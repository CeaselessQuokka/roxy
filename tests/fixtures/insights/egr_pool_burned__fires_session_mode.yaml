# EGR-POOL-BURNED fires when Roblox rate-limits a large share of rotator calls, and per-request exits are in use
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "Rotator 429 rate > 20% over 30 min"; evidence "Per exit stats"; change "Session mode
# sticky_until_429, lower weight"; confidence Medium. Thresholds: insight_egr_pool_burned_rotator_429_pct 20.0,
# _window_min 30. Plan 8.6: "switch session mode to sticky_until_429, or lower rotator use".
#
#   rotator_session_mode = per_request (a new exit for every call) with a session template set, so the sticky
#   modes are available (15.3 A: sticky modes need rotator_session_username_template).
#   Last 30 min:  1,000 rotator calls to catalog search, 300 answered 429 (30%), spread over six exits
#                 (events.upstream_attempts: exit-01 60% of its calls down to exit-06 6%).
#   -60 to -30:   1,000 rotator calls, 50 answered 429 (5%).    Over 60 min: 350 of 2,000 (17.5%).
#   Direct traffic is healthy (no 429s).
#
# The session mode is a global setting, so the recommendation is never safe to apply automatically.

format: roxy.insight_fixture/1
rule: EGR-POOL-BURNED
case: fires_session_mode
description: >
  In the last 30 minutes Roblox answered 30% of rotator calls with 429 while Roxy picks a fresh exit address for
  every call. The rule must propose rotator_session_mode sticky_until_429 (keep healthy exits, drop burned ones),
  must not raise rotator use, and must not be safe to auto-apply.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

settings:
  rotator_weight: 40
  rotator_session_mode: per_request
  rotator_session_username_template: "{user}-session-{session}"

traffic_defaults:
  auth_class: anon
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
  direct_ok: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1600, upstream_in: 1730, upstream_out: 270}}
  rotator_ok: {egress: rotator, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 420, p95: 1100, p99: 2000}, bytes: {caller_in: 0, caller_out: 1600, upstream_in: 1730, upstream_out: 270}}
  rotator_429:
    egress: rotator
    outcome: failed
    reason: upstream_cooldown
    status: 429
    source: roxy
    cache_state: "MISS"
    upstream_status: 429
    error: true
    latency_ms: {p50: 380, p95: 900, p99: 1600}
    bytes: {caller_in: 0, caller_out: 75, upstream_in: 150, upstream_out: 270}
    upstream_429: {egress: rotator, retry_after_s: 10}

traffic:
  - {name: search_direct_ok, profile: direct_ok, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-60m", "0m"], total: 4800}
  - {name: games_direct_ok, profile: direct_ok, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 3000}
  - {name: rotator_ok_before, profile: rotator_ok, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-60m", "-30m"], total: 950}
  - {name: rotator_429_before, profile: rotator_429, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-60m", "-30m"], total: 50}
  - {name: rotator_ok_recent, profile: rotator_ok, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-30m", "0m"], total: 700}
  - {name: rotator_429_recent, profile: rotator_429, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-30m", "0m"], total: 300}

events:
  upstream_attempts:
    # Per exit, last 30 min (generators rotator_ok_recent and rotator_429_recent): 429s / calls.
    #   exit-01 90/150, exit-02 80/160, exit-03 60/170, exit-04 40/170, exit-05 20/170, exit-06 10/180.
    - {window: ["-30m", "0m"], total: 90, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 429, kind: first, challenge: false, html_body: false, exit_id: exit-01}
    - {window: ["-30m", "0m"], total: 60, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 200, kind: first, challenge: false, html_body: false, exit_id: exit-01}
    - {window: ["-30m", "0m"], total: 80, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 429, kind: first, challenge: false, html_body: false, exit_id: exit-02}
    - {window: ["-30m", "0m"], total: 80, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 200, kind: first, challenge: false, html_body: false, exit_id: exit-02}
    - {window: ["-30m", "0m"], total: 60, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 429, kind: first, challenge: false, html_body: false, exit_id: exit-03}
    - {window: ["-30m", "0m"], total: 110, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 200, kind: first, challenge: false, html_body: false, exit_id: exit-03}
    - {window: ["-30m", "0m"], total: 40, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 429, kind: first, challenge: false, html_body: false, exit_id: exit-04}
    - {window: ["-30m", "0m"], total: 130, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 200, kind: first, challenge: false, html_body: false, exit_id: exit-04}
    - {window: ["-30m", "0m"], total: 20, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 429, kind: first, challenge: false, html_body: false, exit_id: exit-05}
    - {window: ["-30m", "0m"], total: 150, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 200, kind: first, challenge: false, html_body: false, exit_id: exit-05}
    - {window: ["-30m", "0m"], total: 10, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 429, kind: first, challenge: false, html_body: false, exit_id: exit-06}
    - {window: ["-30m", "0m"], total: 170, endpoint_template: catalog.roblox.com/v1/search/items, egress: rotator, attempt: 1, status: 200, kind: first, challenge: false, html_body: false, exit_id: exit-06}

state:
  settings_history:
    - {at: "-20d", key: rotator_session_username_template, old: "", new: "{user}-session-{session}", source: admin, changed_by: admin, reason: "Session syntax checked against the provider documentation."}
    - {at: "-5d", key: rotator_session_mode, old: "sticky_until_429", new: "per_request", source: admin, changed_by: admin, reason: "Try fresh exits for every call."}
    - {at: "-12d", key: rotator_weight, old: 0, new: 40, source: admin, changed_by: admin, reason: "Spread load across exit addresses."}

expect:
  data_checks:
    - window: ["-30m", "0m"]
      where: {egress: rotator}
      upstream_calls: 1000
      roblox_429: 300
    - window: ["-60m", "-30m"]
      where: {egress: rotator}
      upstream_calls: 1000
      roblox_429: 50
    - window: ["-60m", "0m"]
      where: {egress: direct}
      roblox_429: 0

  fires: true
  others: forbid
  recommendations:
    - rule_id: EGR-POOL-BURNED
      severity: any
      family: egress
      confidence: medium
      safe_auto: false
      change_kinds_forbidden: [ban_add, filter_add, bypass_add, tarpit_category, host_add, bucket_override, credential_allowlist_remove, ignored_param_add, rule_upsert]
      changes_required:
        - {kind: setting, key: rotator_session_mode, current: per_request, proposed: sticky_until_429}
      changes_forbidden:
        - {kind: setting, key: rotator_weight, proposed: {gte: 40}}
        - {kind: setting, key: rotator_session_mode, proposed: {in: [per_request, sticky]}}
        - {kind: setting, key: {in: [rotator_quota_gb_per_month, rotator_hard_stop_pct, direct_weight, rotator_session_username_template]}}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_egr_pool_burned_enabled: 0}
    expect: {fires: false}
  - case: rotator_429_pct_35
    description: A 35% rotator 429 rate is needed; the last 30 minutes show 30%.
    settings: {insight_egr_pool_burned_rotator_429_pct: 35}
    expect: {fires: false}
  - case: window_60
    description: Measured over 60 minutes the rate is 17.5%, under 20%.
    settings: {insight_egr_pool_burned_window_min: 60}
    expect: {fires: false}
  - case: severity_override_critical
    description: insight_egr_pool_burned_severity replaces the computed severity.
    settings: {insight_egr_pool_burned_severity: critical}
    expect:
      fires: true
      recommendations:
        - {severity: critical}
