# CACHE-NEG fires when callers keep refetching the same missing item from Roblox
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "> 100 identical 404 refetches per hour"; evidence "Keys"; change "Raise cache_error_ttl_seconds";
# confidence High. Threshold: insight_cache_neg_min_404_per_hour 100.
#
#   cache_error_ttl_seconds was set to 0 (the v1 behavior: never remember an error answer).
#   Last 60 min, economy.roblox.com/v2/assets/{assetId}/details: two deleted assets polled by a game every 12 s
#   each: 600 requests, all Roblox 404s, 300 per cache key, so 598 identical refetches (299 per key).
#   Also 200 one-off 404s for 200 different users (users.roblox.com/v1/users/{userId}): no key repeats, so none
#   of them is an identical refetch.
#   Request samples carry the cache key ids (key_space deleted_assets: 2 keys; missing_users: 200 keys).
#
# Either reading of the threshold (per key or summed over keys) gives well over 100. cache_error_ttl_seconds is a
# global setting, so the recommendation is never safe to apply automatically.

format: roxy.insight_fixture/1
rule: CACHE-NEG
case: fires
description: >
  With error caching off, two missing assets were fetched from Roblox 300 times each in the last hour, all
  answered 404. The rule must propose a positive cache_error_ttl_seconds (from 0) and nothing else; one-off 404s
  for different users must not count as identical refetches.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

settings:
  cache_error_ttl_seconds: 0

tables:
  rules_cache:
    - {id: 4, pattern: "games.roblox.com/v1/games", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}

traffic_defaults:
  auth_class: anon
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1800, upstream_in: 1900, upstream_out: 420}}
  not_found: {egress: direct, outcome: served_upstream, reason: upstream_4xx, status: 404, source: relay, cache_state: "MISS", latency_ms: {p50: 110, p95: 260, p99: 500}, bytes: {caller_in: 0, caller_out: 90, upstream_in: 180, upstream_out: 420}}

traffic:
  - {name: games_hit, profile: hit, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 2400}
  - {name: games_miss, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 800}
  - name: deleted_asset_poll
    profile: not_found
    endpoint_template: "economy.roblox.com/v2/assets/{assetId}/details"
    places: ["1000000004"]
    window: ["-60m", "0m"]
    per_minute: 10
    samples: {key_space: deleted_assets, keys: 2, body_change_interval_s: 0}
  - name: missing_users
    profile: not_found
    endpoint_template: "users.roblox.com/v1/users/{userId}"
    window: ["-60m", "0m"]
    total: 200
    samples: {key_space: missing_users, keys: 200, body_change_interval_s: 0}

state:
  settings_history:
    - {at: "-6d", key: cache_error_ttl_seconds, old: 60, new: 0, source: admin, changed_by: admin, reason: "Match v1."}

expect:
  data_checks:
    - window: ["-60m", "0m"]
      requests: 4000
      upstream_calls: 1600
      by_reason: {upstream_4xx: 800, upstream_ok: 800, cache_hit: 2400}
    - window: ["-60m", "0m"]
      where: {endpoint_template: "economy.roblox.com/v2/assets/{assetId}/details", status: 404}
      requests: 600
      upstream_calls: 600

  fires: true
  others: forbid
  recommendations:
    - rule_id: CACHE-NEG
      severity: any
      family: cache
      confidence: high
      safe_auto: false
      change_kinds_required: [setting]
      change_kinds_forbidden: [ban_add, filter_add, bypass_add, tarpit_category, routing_rule, host_add, bucket_override, credential_allowlist_remove, ignored_param_add]
      changes_required:
        - {kind: setting, key: cache_error_ttl_seconds, current: 0, proposed: {gt: 0, lte: 3600}}
      changes_forbidden:
        - kind: setting
          key: {in: [cache_ttl_seconds, cache_swr_seconds, cache_stale_seconds, cache_enabled, cache_max_entries, cache_max_bytes]}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_cache_neg_enabled: 0}
    expect: {fires: false}
  - case: min_404_per_hour_1000
    description: 1,000 identical refetches per hour needed; there are 598 (299 per key).
    settings: {insight_cache_neg_min_404_per_hour: 1000}
    expect: {fires: false}
  - case: severity_override_warn
    description: insight_cache_neg_severity replaces the computed severity.
    settings: {insight_cache_neg_severity: warn}
    expect:
      fires: true
      recommendations:
        - {severity: warn}
