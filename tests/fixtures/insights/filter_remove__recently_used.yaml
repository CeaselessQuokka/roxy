# FILTER-REMOVE just under its idle thresholds (30 days for rules, 7 days for bypass entries).
#
#   object                                              age     last hit    why it stays
#   UA rule a1b2c3d4 "OldScraperBot"                    120 d   28 d ago    idle 28 < 30 days
#   endpoint block economy.roblox.com/v1/purchases/*    29 d    never       idle 29 < 30 days (created 29 days ago)
#   bypass 198.51.100.20/32 (expires in 10 d)           12 d    6 d ago     unused 6 < 7 days, and it expires
#   ban place 1000000150 (permanent, admin)             2 d     2 min ago   a small place (40 requests in the last
#                                                                           day), not a top legitimate place
#
# The six busy places (1000000101 to 1000000106) are not banned. Variants lower each idle threshold under the
# evidence and check that exactly the matching objects appear.

format: roxy.insight_fixture/1
rule: FILTER-REMOVE
case: recently_used
description: >
  A UA rule last hit 28 days ago, an endpoint block created 29 days ago, a bypass entry used 6 days ago and a ban on a
  small place. Nothing is past its idle threshold and no ban hits a top legitimate place, so FILTER-REMOVE must not
  fire.
now: "2026-10-07T15:00:00Z"

tables:
  rules_user_agent:
    - {id: "a1b2c3d4", needle: "OldScraperBot", mode: contains, kind: burst, scope: ip, limit: 1, period: 3600, position: 1, enabled: 1, created_at: "-120d", created_by: admin, x_last_hit_at: "-28d"}
  rules_endpoint_block:
    - {id: 1, pattern: "economy.roblox.com/v1/purchases/*", type: glob, message: "Purchases are not available through Roxy.", enabled: 1, created_at: "-29d", created_by: admin, x_last_hit_at: null}
  access_list:
    - {id: 1, kind: bypass, cidr: "198.51.100.20/32", note: "Load test box", expires_at: "+10d", created_by: admin, created_at: "-12d", x_last_hit_at: "-6d"}
  bans:
    - {id: 1, subject_type: place, subject: "1000000150", reason_code: manual, reason_text: "Place id used by a scraper script.", created_at: "-2d", expires_at: null, created_by: admin, hits: 380, last_hit_at: "-2m"}

traffic_defaults:
  auth_class: anon
  bypass: false
  error: false

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", upstream_calls: 0, latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", upstream_calls: 1, latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1800, upstream_in: 1900, upstream_out: 420}}
  banned: {egress: none, outcome: refused, reason: banned, status: 429, source: roxy, cache_state: "NA", upstream_calls: 0, latency_ms: 1, bytes: {caller_in: 0, caller_out: 90}}
  busy_places:
    clients: {cidr: "203.0.113.0/26", count: 50}
    places: ["1000000101", "1000000102", "1000000103", "1000000104", "1000000105", "1000000106"]
    user_agent: "Roblox/Linux"

traffic:
  - {name: busy_hit, profile: [hit, busy_places], endpoint_template: games.roblox.com/v1/games, window: ["-24h", "0m"], per_minute: 21}
  - {name: busy_miss, profile: [miss, busy_places], endpoint_template: "users.roblox.com/v1/users/{userId}", window: ["-24h", "0m"], per_minute: 9}
  - {name: small_place_banned, profile: banned, client_ip: "203.0.113.200", place_id: "1000000150", user_agent: "Roblox/Linux", endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 40}

state:
  client_scores:
    - {clients: {cidr: "203.0.113.0/26", count: 50}, bot_score: 9}
    - {ip: "203.0.113.200", bot_score: 18}

expect:
  data_checks:
    - {window: ["-24h", "0m"], where: {place_id: "1000000101"}, requests: 7200}
    - {window: ["-24h", "0m"], where: {place_id: "1000000150"}, requests: 40, refused: 40}
  fires: false

variants:
  - case: idle_rule_days_lowered
    description: At 25 idle days the UA rule (idle 28 days) and the endpoint block (never hit, created 29 days ago) are both stale.
    settings: {insight_filter_remove_idle_rule_days: 25}
    expect:
      fires: true
      others: forbid
      recommendations:
        - changes_required:
            - any_of:
                - {kind: rule_delete, table: rules_user_agent, match: {id: "a1b2c3d4"}}
                - {kind: filter_remove, table: rules_user_agent, match: {id: "a1b2c3d4"}}
        - changes_required:
            - any_of:
                - {kind: rule_delete, table: rules_endpoint_block, match: {pattern: "economy.roblox.com/v1/purchases/*", type: glob}}
                - {kind: filter_remove, table: rules_endpoint_block, match: {pattern: "economy.roblox.com/v1/purchases/*", type: glob}}
  - case: idle_bypass_days_lowered
    description: At 5 unused days the bypass entry (unused 6 days) is stale; the rules are not.
    settings: {insight_filter_remove_idle_bypass_days: 5}
    expect:
      fires: true
      others: forbid
      recommendations:
        - subject_contains: "198.51.100.20"
          changes_required:
            - any_of:
                - {kind: bypass_remove, match: {kind: bypass, cidr: "198.51.100.20/32"}}
                - {kind: rule_delete, table: access_list, match: {kind: bypass, cidr: "198.51.100.20/32"}}
                - {kind: rule_upsert, table: access_list, match: {kind: bypass, cidr: "198.51.100.20/32"}, proposed: {expires_at: {present: true}}}
                - {kind: bypass_add, proposed: {kind: bypass, cidr: "198.51.100.20/32", expires_at: {present: true}}}
