# CRED-EXPIRING on a probe recorded the way egress/credential.py records it: result `rejected`, status 403
# (format: tests/fixtures/insights/README.md). Added by the rules_cache_egress author (P10).
#
# 11.5 row: "Probe 401/403, or account warning in response"; change "Manual: renew credential (never auto-switch)".
#
#   egress/credential.py records each probe as a `credential_probe` event with `{kind, result, status}`, where a 401
#   or 403 answer has `result: rejected` and the status in `status` (its `last_probe_result` column says
#   `rejected_403`; the other CRED-EXPIRING fixtures use that form in the event too). The credential (set 20 days
#   ago) passed its probes until 5 minutes ago, when Roblox answered 403; the status is `rejected`.

format: roxy.insight_fixture/1
rule: CRED-EXPIRING
case: probe_rejected_403
description: >
  The newest credential probe was answered 403, recorded as result `rejected` with status 403, the form the egress
  module writes. The rule must fire critical with a manual "renew the credential" change and no other change.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

state:
  credential:
    present: true
    status: rejected
    status_at: "-5m"
    set_at: "-20d"
    account_id: "1000001"
    probes:
      - {at: "-65m", kind: liveness, status: 200, result: ok}
      - {at: "-35m", kind: liveness, status: 200, result: ok}
      - {at: "-5m", kind: liveness, status: 403, result: rejected}

expect:
  fires: true
  others: forbid
  recommendations:
    - rule_id: CRED-EXPIRING
      severity: critical
      family: credential
      confidence: high
      safe_auto: false
      change_kinds_required: [manual]
      change_kinds_forbidden: [setting, bucket_override, rule_upsert, rule_delete, filter_add, filter_remove, ban_add, ban_remove, bypass_add, bypass_remove, ignored_param_add, tarpit_category, routing_rule, credential_allowlist_remove, host_add]

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_cred_expiring_enabled: 0}
    expect: {fires: false}
