# UP-BUCKET-TUNE, too loose: Roblox 429s attributed to one endpoint's bucket (format: README.md here).
#
# 11.5: "too loose: any 429 attributed to this bucket key (endpoint, host or egress, by the 7.3 correlation
# check)"; change: "bucket_override: ... lower by 30% for that key only"; lower_pct = 30. The 7.3 check blames
# the host when 3 or more templates of one host 429 within 60 s, and the egress when 429s appear across hosts on
# one egress within 60 s. Here only ONE template ever got a 429 (6 of them, 40 to 30 minutes ago, on direct), so
# the 429s belong to that endpoint's bucket:
#
#   bucket                                              rate             proposal
#   endpoint:users.roblox.com/v1/usernames/users        200/min (admin)  140/min (-30%); no host or egress change
#
# 11.5 gives the too-loose branch no window; every attributed 429 here is within the last hour and there are no
# others in the last 48 hours. adaptive_rate_enabled = 0, so the controller has not already cut the bucket.

format: roxy.insight_fixture/1
rule: UP-BUCKET-TUNE
case: too_loose_endpoint
description: >
  An admin raised the username lookup endpoint's bucket to 200 per minute and Roblox answered six of its calls
  with 429 in the last hour, with no 429s on any other endpoint. The rule must propose cutting that endpoint's
  bucket by 30% to 140 per minute, and nothing for the users host, the direct egress or any global default.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

settings:
  adaptive_rate_enabled: 0

tables:
  upstream_limits:
    - {bucket_key: "endpoint:users.roblox.com/v1/usernames/users", per_min: 200, burst: 10, origin: admin, updated_at: "-3d", updated_by: admin}

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003"]

profiles:
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 200, p95: 500, p99: 900}}
  usernames: {endpoint_template: users.roblox.com/v1/usernames/users, method: POST, cache_state: "OFF"}

traffic:
  - {name: usernames_ok, profile: [miss, usernames], window: ["-60m", "0m"], per_minute: 150}
  - name: usernames_429
    profile: usernames
    window: ["-40m", "-30m"]
    total: 6
    egress: direct
    outcome: failed
    reason: upstream_cooldown
    status: 429
    source: roxy
    upstream_status: 429
    upstream_calls: 1
    error: true
    upstream_429: {egress: direct, retry_after_s: 10}
  - {name: user_ok, profile: miss, endpoint_template: "users.roblox.com/v1/users/{userId}", window: ["-60m", "0m"], per_minute: 40}
  - {name: games_ok, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], per_minute: 40}

state:
  buckets:
    - bucket_key: "endpoint:users.roblox.com/v1/usernames/users"
      per_min: 200
      burst: 10
      fill_pct: 70
      history:
        - {window: ["-60m", "0m"], fill_pct_peak: 95, attempts: 9006, rejections: 0}
  settings_history:
    - {at: "-30d", key: adaptive_rate_enabled, old: 1, new: 0, source: admin, changed_by: admin, reason: "Bucket rates by hand for now."}

expect:
  data_checks:
    - window: ["-60m", "0m"]
      where: {endpoint_template: users.roblox.com/v1/usernames/users}
      roblox_429: 6
    - window: ["-48h", "0m"]
      roblox_429: 6

  fires: true
  others: forbid
  recommendations:
    - subject_contains: "users.roblox.com/v1/usernames/users"
      confidence: medium
      family: upstream
      change_kinds_required: [bucket_override]
      change_kinds_forbidden: [setting, routing_rule, ban_add]
      exact_changes: true
      changes_required:
        - kind: bucket_override
          bucket_key: "endpoint:users.roblox.com/v1/usernames/users"
          current: {per_min: 200}
          proposed: {per_min: {between: [138, 142]}}   # -30%: 140
      changes_forbidden:
        - kind: bucket_override
          bucket_key: {ne: "endpoint:users.roblox.com/v1/usernames/users"}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_up_bucket_tune_enabled: 0}
    expect: {fires: false}
  - case: lower_pct_50
    description: The cut follows insight_up_bucket_tune_lower_pct (200 - 50% = 100).
    settings: {insight_up_bucket_tune_lower_pct: 50}
    expect:
      fires: true
      others: forbid
      recommendations:
        - changes_required:
            - kind: bucket_override
              bucket_key: "endpoint:users.roblox.com/v1/usernames/users"
              proposed: {per_min: {between: [98, 102]}}
