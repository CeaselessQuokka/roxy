# UP-429-CREDENTIAL just under its threshold: zero credential 429s (format: README.md in this directory).
#
# The threshold is "any credential 429" (min_429s = 1), so "just under" means none in the rule's window while
# everything around it looks alarming:
#
#   the credential bucket is saturated (fill 100%, 31 rejections)   state.buckets, cred_busy (upstream_busy)
#   25 Roblox 429s on the same host, on the DIRECT path               resale_429 (anonymous, not the credential)
#   one credential 429, eight days ago                                events.upstream_429 at -8d
#
# 11.5 gives this rule no window parameter. The fixture assumes the rule looks back at most 7 days (it reports a
# current problem; an 8 day old 429 is history). Direct-path 429s belong to UP-429-ENDPOINT, never to this rule.

format: roxy.insight_fixture/1
rule: UP-429-CREDENTIAL
case: busy_but_no_429
description: >
  The allowlisted credential endpoint runs at its bucket limit and some calls wait or are refused as busy, and
  Roblox rate-limits an anonymous endpoint of the same host on the direct path, but no credential call got a 429
  in the last week. The rule must stay quiet.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  credential_allowlist:
    - {id: 1, pattern: "economy.roblox.com/v1/assets/*/resellers", type: glob, methods: "GET", cache_private: 1, identical_anonymous: 0, created_at: "-40d", created_by: admin}

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "198.51.100.0/27", count: 12}
  places: ["1000000011", "1000000012"]

profiles:
  cred_ok:
    endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers"
    egress: credential
    auth_class: cred
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "OFF"
    latency_ms: {p50: 220, p95: 600, p99: 1100}
    queue_wait_ms: {p50: 300, p95: 2500, p99: 3800}

traffic:
  - {name: cred_ok, profile: cred_ok, window: ["-60m", "0m"], per_minute: 18}
  - name: cred_busy
    endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers"
    window: ["-60m", "0m"]
    total: 31
    egress: none
    outcome: failed
    reason: upstream_busy           # the credential bucket could not grant within the queue budget
    status: 429
    source: roxy
    cache_state: "OFF"
    error: true
    latency_ms: 4000
    queue_wait_ms: 4000
  - name: resale_ok
    endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resale-data"
    clients: {cidr: "203.0.113.0/26", count: 40}
    window: ["-60m", "0m"]
    per_minute: 20
    egress: direct
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "MISS"
    latency_ms: {p50: 150, p95: 400, p99: 800}
  - name: resale_429
    endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resale-data"
    clients: {cidr: "203.0.113.0/26", count: 40}
    window: ["-30m", "-20m"]
    total: 25
    egress: direct
    outcome: failed
    reason: upstream_cooldown
    status: 429
    source: roxy
    cache_state: "MISS"
    upstream_status: 429
    upstream_calls: 1
    error: true
    upstream_429: {egress: direct, retry_after_s: 30}

events:
  upstream_429:
    - {at: "-8d", endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers", egress: credential, retry_after_s: 60}
  internal_calls:
    - {at: "-60m", purpose: credential_probe, trigger: scheduled, egress: credential, endpoint_template: users.roblox.com/v1/users/authenticated, status: 200}
    - {at: "-30m", purpose: credential_probe, trigger: scheduled, egress: credential, endpoint_template: users.roblox.com/v1/users/authenticated, status: 200}

state:
  credential:
    present: true
    status: active
    status_at: "-60d"
    set_at: "-60d"
    account_id: "1000009999"
    probes:
      - {at: "-60m", kind: scheduled, status: 200, result: ok}
      - {at: "-30m", kind: scheduled, status: 200, result: ok}
  buckets:
    - bucket_key: "egress:credential"
      per_min: 20
      burst: 3
      fill_pct: 100
      history:
        - {window: ["-60m", "0m"], fill_pct_peak: 100, attempts: 1111, rejections: 31}

expect:
  data_checks:
    - window: ["-7d", "0m"]
      where: {egress: credential}
      roblox_429: 0
    - window: ["-9d", "0m"]
      where: {egress: credential}
      roblox_429: 1
    - window: ["-60m", "0m"]
      where: {egress: direct}
      roblox_429: 25
    - window: ["-60m", "0m"]
      by_reason: {upstream_busy: 31}

  fires: false
