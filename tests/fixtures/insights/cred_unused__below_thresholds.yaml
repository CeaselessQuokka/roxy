# CRED-UNUSED stays quiet when each allowlist row misses one threshold by a little
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "Anonymous calls to the same template succeed with same body" (insight_cred_unused_min_comparisons
# 20, _identical_pct 100).
#
#   allowlist row                                    comparisons  identical      misses
#   1  games.roblox.com/v1/games/*/favorites/count            19   19 (100%)      comparisons (>= 20)
#   2  thumbnails.roblox.com/v1/assets                        25   24 (96%)       identical share (100%)
#
# Row 2's one difference is a 200 on both paths with different bodies (the credential path returned a
# signed-in-only thumbnail state), which is exactly why 100% is the default.
# All comparisons fall in the last 25 minutes, so the counts are the same for any window of 25 minutes or more
# (11.5 gives the row no window; see cred_unused__fires.yaml).

format: roxy.insight_fixture/1
rule: CRED-UNUSED
case: below_thresholds
description: >
  One allowlist row has only 19 identical comparisons (20 needed); the other has 25 comparisons with one
  difference (96%, 100% needed). Nothing may fire at the defaults; each variant fires exactly the row next to the
  threshold it moves.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  credential_allowlist:
    - {id: 1, pattern: "games.roblox.com/v1/games/*/favorites/count", type: glob, methods: "GET", cache_private: 1, identical_anonymous: 0, created_at: "-30d", created_by: admin}
    - {id: 2, pattern: "thumbnails.roblox.com/v1/assets", type: glob, methods: "GET", cache_private: 1, identical_anonymous: 0, created_at: "-30d", created_by: admin}

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
  cred_miss: {auth_class: cred, egress: credential, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 160, p95: 420, p99: 800}, bytes: {caller_in: 0, caller_out: 300, upstream_in: 420, upstream_out: 650}}

traffic:
  - {name: favorites_cred, profile: cred_miss, endpoint_template: "games.roblox.com/v1/games/{universeId}/favorites/count", window: ["-60m", "0m"], per_minute: 6}
  - {name: assets_cred, profile: cred_miss, endpoint_template: thumbnails.roblox.com/v1/assets, window: ["-60m", "0m"], per_minute: 8}

state:
  credential:
    present: true
    status: active
    status_at: "-30d"
    set_at: "-30d"
    account_id: "1000001"
  x_credential_comparisons:
    - {window: ["-19m", "0m"], per_minute: 1, endpoint_template: "games.roblox.com/v1/games/{universeId}/favorites/count", method: GET, anon_status: 200, cred_status: 200, identical: true}
    - {window: ["-25m", "-1m"], per_minute: 1, endpoint_template: thumbnails.roblox.com/v1/assets, method: GET, anon_status: 200, cred_status: 200, identical: true}
    - {at: "-30s", endpoint_template: thumbnails.roblox.com/v1/assets, method: GET, anon_status: 200, cred_status: 200, identical: false}

expect:
  fires: false

variants:
  - case: min_comparisons_19
    description: Nineteen comparisons are enough; the favorites row (19 of 19 identical) fires.
    settings: {insight_cred_unused_min_comparisons: 19}
    expect:
      fires: true
      others: forbid
      recommendations:
        - subject_contains: "favorites/count"
          severity: any
          changes_required:
            - {kind: credential_allowlist_remove, match: {pattern: {matches_targets: ["games.roblox.com/v1/games/1000000801/favorites/count"]}}}
  - case: identical_pct_96
    description: 96% identical is enough; the assets row (24 of 25) fires.
    settings: {insight_cred_unused_identical_pct: 96}
    expect:
      fires: true
      others: forbid
      recommendations:
        - subject_contains: "thumbnails.roblox.com/v1/assets"
          severity: any
          changes_required:
            - {kind: credential_allowlist_remove, match: {pattern: {matches_targets: ["thumbnails.roblox.com/v1/assets"]}}}
