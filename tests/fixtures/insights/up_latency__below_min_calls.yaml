# UP-LATENCY just under its minimum sample size (format: README.md in this directory).
#
# 11.5: "... over 30 min (min 200 calls)". A quiet night: 150 upstream calls in the last 30 minutes, slow ones
# (rollup histogram p95 above 3 s, p99 above 4 s), but too few to judge. A minimum of 150 (variant) lets the rule
# fire. Cache hits (600) are not upstream calls and do not count toward the minimum.

format: roxy.insight_fixture/1
rule: UP-LATENCY
case: below_min_calls
description: >
  Only 150 upstream calls were made in the last 30 minutes. Their latency is high, but the sample is under the
  200 call minimum, so the rule must not fire; with a minimum of 150 it does.
now: "2026-10-07T06:00:00Z"
seed_defaults: false

tables:
  rules_cache:
    - {id: 1, pattern: "avatar.roblox.com/v1/users/*/avatar", type: glob, ttl: 60, stale_ttl: 0, methods: "GET", origin: admin, created_at: "-30d"}

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/28", count: 8}
  places: ["1000000001"]
  endpoint_template: "avatar.roblox.com/v1/users/{userId}/avatar"

traffic:
  - name: avatar_hit
    window: ["-60m", "0m"]
    per_minute: 20
    egress: none
    outcome: served_cache
    reason: cache_hit
    status: 200
    source: cache
    cache_state: "HIT"
    latency_ms: 3
  - name: avatar_miss_slow
    window: ["-60m", "0m"]
    per_minute: 5
    egress: direct
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "MISS"
    latency_ms: {p50: 1200, p95: 3600, p99: 5200}

expect:
  data_checks:
    - window: ["-30m", "0m"]
      requests: 750
      upstream_calls: 150

  fires: false

variants:
  - case: min_calls_150
    description: 150 calls meet a minimum of 150, and both percentiles are over their limits.
    settings: {insight_up_latency_min_calls: 150}
    expect:
      fires: true
      others: forbid
      recommendations:
        - changes_required:
            - kind: rule_upsert
              table: rules_cache
              match: {pattern: {matches_targets: ["avatar.roblox.com/v1/users/1000000001/avatar"]}}
