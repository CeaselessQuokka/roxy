# EGR-POOL-BURNED stays quiet just under its rate, and its window really limits what it measures
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "Rotator 429 rate > 20% over 30 min" (insight_egr_pool_burned_rotator_429_pct 20.0, _window_min 30).
#
#   rotator_session_mode per_request with a session template set (as in egr_pool_burned__fires_session_mode).
#   Last 30 min:  1,000 rotator calls, 195 answered 429 (19.5%)   <- just under 20%
#   -60 to -30:   1,000 rotator calls, 400 answered 429 (40%)     Over 60 min: 595 of 2,000 (29.75%).

format: roxy.insight_fixture/1
rule: EGR-POOL-BURNED
case: below_threshold
description: >
  The rotator's 429 rate over the last 30 minutes is 19.5%, just under 20%, after a worse half hour before that.
  Nothing may fire at the defaults; a 19% threshold or a 60 minute window must fire and propose sticky_until_429.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

settings:
  rotator_weight: 40
  rotator_session_mode: per_request
  rotator_session_username_template: "{user}-session-{session}"

traffic_defaults:
  auth_class: anon
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
  direct_ok: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1600, upstream_in: 1730, upstream_out: 270}}
  rotator_ok: {egress: rotator, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 420, p95: 1100, p99: 2000}, bytes: {caller_in: 0, caller_out: 1600, upstream_in: 1730, upstream_out: 270}}
  rotator_429:
    egress: rotator
    outcome: failed
    reason: upstream_cooldown
    status: 429
    source: roxy
    cache_state: "MISS"
    upstream_status: 429
    error: true
    latency_ms: {p50: 380, p95: 900, p99: 1600}
    bytes: {caller_in: 0, caller_out: 75, upstream_in: 150, upstream_out: 270}
    upstream_429: {egress: rotator, retry_after_s: 10}

traffic:
  - {name: search_direct_ok, profile: direct_ok, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-60m", "0m"], total: 4800}
  - {name: games_direct_ok, profile: direct_ok, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 3000}
  - {name: rotator_ok_before, profile: rotator_ok, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-60m", "-30m"], total: 600}
  - {name: rotator_429_before, profile: rotator_429, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-60m", "-30m"], total: 400}
  - {name: rotator_ok_recent, profile: rotator_ok, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-30m", "0m"], total: 805}
  - {name: rotator_429_recent, profile: rotator_429, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-30m", "0m"], total: 195}

state:
  settings_history:
    - {at: "-20d", key: rotator_session_username_template, old: "", new: "{user}-session-{session}", source: admin, changed_by: admin, reason: "Session syntax checked against the provider documentation."}
    - {at: "-5d", key: rotator_session_mode, old: "sticky_until_429", new: "per_request", source: admin, changed_by: admin, reason: "Try fresh exits for every call."}
    - {at: "-12d", key: rotator_weight, old: 0, new: 40, source: admin, changed_by: admin, reason: "Spread load across exit addresses."}

expect:
  data_checks:
    - window: ["-30m", "0m"]
      where: {egress: rotator}
      upstream_calls: 1000
      roblox_429: 195
    - window: ["-60m", "0m"]
      where: {egress: rotator}
      upstream_calls: 2000
      roblox_429: 595
  fires: false

variants:
  - case: rotator_429_pct_19
    description: Over 19% is enough; the last 30 minutes show 19.5%.
    settings: {insight_egr_pool_burned_rotator_429_pct: 19}
    expect:
      fires: true
      others: forbid
      recommendations:
        - severity: any
          safe_auto: false
          changes_required:
            - {kind: setting, key: rotator_session_mode, current: per_request, proposed: sticky_until_429}
  - case: window_60
    description: Over 60 minutes the rate is 29.75%.
    settings: {insight_egr_pool_burned_window_min: 60}
    expect:
      fires: true
      others: forbid
      recommendations:
        - severity: any
          safe_auto: false
          changes_required:
            - {kind: setting, key: rotator_session_mode, current: per_request, proposed: sticky_until_429}
