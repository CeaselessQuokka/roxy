# UP-TIMEOUT caused by the rotator (format: README.md in this directory).
#
# 11.5: "Timeout rate > 2% over 10 min"; evidence: per egress and host; change: "If rotator: lower rotator weight
# or change session mode; if direct: raise request_timeout modestly or check network (health check link)";
# confidence medium. The timeouts here all happen on rotator calls, so the change is a lower rotator_weight or a
# different rotator_session_mode (both global settings: not safe_auto), and raising request_timeout is the wrong
# fix.
#
# Last 10 minutes (direct_weight 100, rotator_weight 50):
#
#   generator                 requests  calls  timed-out calls  final egress
#   direct_ok                 1,000     1,000  0                direct
#   rotator_ok                440       440    0                rotator
#   rotator_timeout_failed    45        90     90 (rotator)     rotator (504 to the caller)
#   rotator_timeout_direct_ok 30        60     30 (rotator)     direct (retried on direct, 200)
#
# Timed-out calls: 120 of 1,590 (7.5%); on the rotator 120 of 560 (21.4%); requests that ended in a timeout:
# 45 of 1,515 (3.0%); requests that met one: 75 (5.0%). Every reading is above 2%; direct had none.

format: roxy.insight_fixture/1
rule: UP-TIMEOUT
case: rotator_timeouts
description: >
  A third of the traffic goes through the rotator, and for the last ten minutes a fifth of rotator calls timed
  out while direct calls were fine. The rule must recommend a lower rotator_weight or another
  rotator_session_mode, must not raise request_timeout, and is not safe_auto.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

settings:
  rotator_enabled: 1
  rotator_weight: 50
  rotator_quota_gb_per_month: 20

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003"]
  endpoint_template: games.roblox.com/v1/games
  outcome: served_upstream
  reason: upstream_ok
  status: 200
  source: relay
  cache_state: "MISS"
  latency_ms: {p50: 150, p95: 400, p99: 800}

traffic:
  - {name: direct_ok_before, egress: direct, window: ["-60m", "-10m"], per_minute: 100}
  - {name: rotator_ok_before, egress: rotator, window: ["-60m", "-10m"], per_minute: 50, latency_ms: {p50: 400, p95: 900, p99: 1500}}
  - {name: direct_ok, egress: direct, window: ["-10m", "0m"], per_minute: 100}
  - {name: rotator_ok, egress: rotator, window: ["-10m", "0m"], total: 440, latency_ms: {p50: 400, p95: 900, p99: 1500}}
  - name: rotator_timeout_failed
    egress: rotator
    window: ["-10m", "0m"]
    total: 45
    outcome: failed
    reason: upstream_timeout
    status: 504
    source: roxy
    upstream_calls: 2
    error: true
    latency_ms: 30500
  - name: rotator_timeout_direct_ok
    egress: direct              # final attempt
    window: ["-10m", "0m"]
    total: 30
    upstream_calls: 2
    latency_ms: {p50: 15600, p95: 16000, p99: 16400}

events:
  upstream_attempts:
    - {window: ["-10m", "0m"], total: 45, endpoint_template: games.roblox.com/v1/games, egress: rotator, attempt: 1, status: null, kind: first}
    - {window: ["-10m", "0m"], total: 45, endpoint_template: games.roblox.com/v1/games, egress: rotator, attempt: 2, status: null, kind: retry_5xx}
    - {window: ["-10m", "0m"], total: 30, endpoint_template: games.roblox.com/v1/games, egress: rotator, attempt: 1, status: null, kind: first}
    - {window: ["-10m", "0m"], total: 30, endpoint_template: games.roblox.com/v1/games, egress: direct, attempt: 2, status: 200, kind: retry_5xx}

state:
  settings_history:
    - {at: "-5d", key: rotator_weight, old: 0, new: 50, source: admin, changed_by: admin, reason: "Spread load across exits."}

expect:
  data_checks:
    - window: ["-10m", "0m"]
      requests: 1515
      upstream_calls: 1590
      by_reason: {upstream_timeout: 45}
    - window: ["-10m", "0m"]
      where: {egress: rotator}
      requests: 485
      upstream_calls: 530
    - window: ["-60m", "-10m"]
      by_reason: {upstream_timeout: 0}

  fires: true
  others: forbid
  recommendations:
    - confidence: medium
      family: upstream
      safe_auto: false
      change_kinds_forbidden: [bucket_override, ban_add, credential_allowlist_remove]
      changes_required:
        - any_of:
            - {kind: setting, key: rotator_weight, current: 50, proposed: {lt: 50}}
            - {kind: setting, key: rotator_session_mode, current: sticky_until_429, proposed: {ne: sticky_until_429}}
      changes_forbidden:
        - {kind: setting, key: request_timeout}
        - {kind: setting, key: rotator_weight, proposed: {gte: 50}}
        - {kind: setting, key: direct_weight, proposed: {lt: 100}}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_up_timeout_enabled: 0}
    expect: {fires: false}
  - case: rate_pct_25
    description: No reading of the timeout rate reaches 25% (the highest is 21.4%, rotator calls only).
    settings: {insight_up_timeout_rate_pct: 25}
    expect: {fires: false}
