# UP-429-CREDENTIAL: Roblox rate-limits the account on an allowlisted endpoint (format: README.md here).
#
# 11.5: "Any credential 429" (insight_up_429_credential_min_429s = 1, a count, so ">= 1"); evidence: endpoint,
# Retry-After, bucket fill; change: "Lower credential_bucket_per_min; remove the endpoint from the credential
# allowlist if it works anonymously"; confidence high. credential_bucket_per_min is a global setting, so the
# recommendation is never safe_auto (11.2). Nothing here shows the endpoint working anonymously
# (credential_allowlist.identical_anonymous = 0, no anonymous calls to it), so the allowlist entry must stay.
#
#   fact                                                 where it comes from here
#   3 credential 429s, 10 to 7 minutes ago, RA 60 s      cred_429 (upstream_429 rows with egress credential)
#   allowlisted GET economy.../assets/{assetId}/resellers tables.credential_allowlist id 1
#   credential bucket 20 per minute, peaked at 100%      state.buckets egress:credential
#   callers during the credential cooldown got 503       cred_unavailable (credential_unavailable, no call)
#   the credential itself is fine (probes answer 200)    state.credential.probes, events.internal_calls

format: roxy.insight_fixture/1
rule: UP-429-CREDENTIAL
case: allowlisted_endpoint
description: >
  The one allowlisted credential endpoint runs at about 15 calls per minute against a 20 per minute credential
  bucket, and Roblox answered three of its calls with 429 in the last ten minutes. The rule must recommend a
  lower credential_bucket_per_min (still above the 2 per minute reserved for probes), must not remove the
  allowlist entry (no evidence that it works anonymously), and must not be safe_auto.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  credential_allowlist:
    - {id: 1, pattern: "economy.roblox.com/v1/assets/*/resellers", type: glob, methods: "GET", cache_private: 1, identical_anonymous: 0, created_at: "-40d", created_by: admin}

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "198.51.100.0/27", count: 12}
  places: ["1000000011", "1000000012"]

profiles:
  cred_ok:
    endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers"
    egress: credential
    auth_class: cred
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "OFF"          # cache_private: credential answers are never stored
    latency_ms: {p50: 220, p95: 600, p99: 1100}
    bytes: {caller_in: 0, caller_out: 2200, upstream_in: 2400, upstream_out: 450}
  anon_hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: {p50: 3, p95: 9, p99: 20}}
  anon_miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 150, p95: 400, p99: 800}}

traffic:
  - {name: cred_ok_before, profile: cred_ok, window: ["-60m", "-10m"], per_minute: 15}
  - {name: cred_ok_episode, profile: cred_ok, window: ["-10m", "-7m"], per_minute: 5}
  - name: cred_429
    profile: cred_ok
    window: ["-10m", "-7m"]
    per_minute: 1
    outcome: failed
    reason: upstream_cooldown       # 7.13 "Roblox 429 or cooldown with no stale": the caller gets 429
    status: 429
    source: roxy
    upstream_status: 429
    error: true
    latency_ms: {p50: 180, p95: 300, p99: 400}
    upstream_429: {egress: credential, retry_after_s: 60, ratelimit_headers: {x-ratelimit-remaining: "0", x-ratelimit-reset: "60"}}
  - name: cred_unavailable
    endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers"
    window: ["-10m", "-7m"]
    per_minute: 9
    egress: none                    # the credential is cooling down; nothing is sent
    outcome: failed
    reason: credential_unavailable
    status: 503
    source: roxy
    cache_state: "OFF"
    error: true
    latency_ms: 2
  - {name: cred_ok_after, profile: cred_ok, window: ["-7m", "0m"], per_minute: 15}
  # Anonymous traffic on other endpoints, unaffected.
  - {name: anon_hit, profile: anon_hit, endpoint_template: catalog.roblox.com/v1/search/items, clients: {cidr: "203.0.113.0/26", count: 40}, window: ["-60m", "0m"], per_minute: 60}
  - {name: anon_miss, profile: anon_miss, endpoint_template: catalog.roblox.com/v1/search/items, clients: {cidr: "203.0.113.0/26", count: 40}, window: ["-60m", "0m"], per_minute: 25}

events:
  internal_calls:
    - {at: "-60m", purpose: credential_probe, trigger: scheduled, egress: credential, endpoint_template: users.roblox.com/v1/users/authenticated, status: 200}
    - {at: "-30m", purpose: credential_probe, trigger: scheduled, egress: credential, endpoint_template: users.roblox.com/v1/users/authenticated, status: 200}

state:
  credential:
    present: true
    status: active
    status_at: "-60d"
    set_at: "-60d"
    account_id: "1000009999"
    probes:
      - {at: "-60m", kind: scheduled, status: 200, result: ok}
      - {at: "-30m", kind: scheduled, status: 200, result: ok}
  cooldowns:
    - {key: credential, until: "-7m", source: retry_after, set_at: "-8m", hits: 3}
  buckets:
    - bucket_key: "egress:credential"
      per_min: 20
      burst: 3
      fill_pct: 45
      history:
        - {window: ["-60m", "-10m"], fill_pct_peak: 88, attempts: 750, rejections: 0}
        - {window: ["-10m", "0m"], fill_pct_peak: 100, attempts: 123, rejections: 0}

expect:
  data_checks:
    - window: ["-60m", "0m"]
      where: {egress: credential}
      roblox_429: 3
      requests: 873
      upstream_calls: 873
    - window: ["-60m", "0m"]
      where: {endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers"}
      requests: 900
      by_reason: {credential_unavailable: 27, upstream_cooldown: 3, upstream_ok: 870}
    - window: ["-60m", "0m"]
      roblox_429: 3

  fires: true
  others: forbid
  recommendations:
    - confidence: high
      family: upstream
      safe_auto: false               # credential_bucket_per_min is a global setting
      change_kinds_required: [setting]
      change_kinds_forbidden: [credential_allowlist_remove, routing_rule, ban_add, filter_add]
      changes_required:
        - kind: setting
          key: credential_bucket_per_min
          current: 20
          proposed: {lt: 20, gte: 3}  # validate_cross: must stay above credential_probe_reserved_per_min (2)
      changes_forbidden:
        - {kind: setting, key: credential_bucket_per_min, proposed: {gte: 20}}
        - {kind: setting, key: credential_enabled}
        - kind: setting
          key: {in: [direct_bucket_per_min, global_bucket_per_min, endpoint_bucket_default_per_min, host_bucket_default_per_min]}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_up_429_credential_enabled: 0}
    expect: {fires: false}
  - case: min_429s_4
    description: Three credential 429s are one short of a minimum of four.
    settings: {insight_up_429_credential_min_429s: 4}
    expect: {fires: false}
  - case: min_429s_3
    description: The minimum is a count (">= 1" by default); three 429s meet a minimum of three.
    settings: {insight_up_429_credential_min_429s: 3}
    expect:
      fires: true
      others: forbid
      recommendations:
        - changes_required:
            - {kind: setting, key: credential_bucket_per_min, current: 20, proposed: {lt: 20}}
  - case: severity_override_info
    description: insight_up_429_credential_severity replaces the computed severity.
    settings: {insight_up_429_credential_severity: info}
    expect:
      fires: true
      recommendations:
        - {severity: info}
