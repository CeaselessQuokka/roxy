# UP-429-HOST just under its thresholds (format: README.md in this directory).
#
# 11.5: ">= 3 templates of one host with 429s in 15 min". Here no host reaches three templates inside the window:
#
#   host                  templates with 429s, last 15 min      older 429s
#   games.roblox.com      /v1/games/votes (11), /v1/games (7)    /v1/games/{gameId}/favorites/count (5), 25 to
#                                                                16 minutes ago: outside the 15 minute window
#   thumbnails.roblox.com /v1/users/avatar-headshot (6),         none
#                         /v1/batch (4)
#   users.roblox.com      /v1/users/{userId} (9)                 none
#
# Variants lower each threshold just enough: a 25 minute window brings the third games template in; a minimum
# of two templates makes games and thumbnails fire but never users (one template).

format: roxy.insight_fixture/1
rule: UP-429-HOST
case: two_templates_in_window
description: >
  Two hosts each have 429s on two endpoints in the last 15 minutes, one host on a single endpoint, and the third
  games.roblox.com endpoint's 429s ended 16 minutes ago. No host has three templates with 429s inside the
  window, so the rule must stay quiet.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

settings:
  adaptive_rate_enabled: 0

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004"]

profiles:
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 150, p95: 400, p99: 800}}
  stale_429:
    egress: direct
    outcome: served_cache
    reason: cache_stale_error
    status: 200
    source: cache
    cache_state: "STALE"
    upstream_status: 429
    upstream_calls: 1
    error: true
    latency_ms: {p50: 90, p95: 200, p99: 350}
    upstream_429: {egress: direct, retry_after_s: 15}

traffic:
  - {name: games_list_miss, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 600}
  - {name: games_list_429, profile: stale_429, endpoint_template: games.roblox.com/v1/games, window: ["-10m", "-2m"], total: 7}
  - {name: votes_miss, profile: miss, endpoint_template: games.roblox.com/v1/games/votes, window: ["-60m", "0m"], total: 500}
  - {name: votes_429, profile: stale_429, endpoint_template: games.roblox.com/v1/games/votes, window: ["-10m", "-2m"], total: 11}
  - {name: favorites_miss, profile: miss, endpoint_template: "games.roblox.com/v1/games/{gameId}/favorites/count", window: ["-60m", "0m"], total: 300}
  - {name: favorites_429_older, profile: stale_429, endpoint_template: "games.roblox.com/v1/games/{gameId}/favorites/count", window: ["-25m", "-16m"], total: 5}
  - {name: headshot_miss, profile: miss, endpoint_template: thumbnails.roblox.com/v1/users/avatar-headshot, window: ["-60m", "0m"], total: 500}
  - {name: headshot_429, profile: stale_429, endpoint_template: thumbnails.roblox.com/v1/users/avatar-headshot, window: ["-14m", "-4m"], total: 6}
  - {name: thumb_batch_miss, profile: miss, endpoint_template: thumbnails.roblox.com/v1/batch, method: POST, cache_state: "OFF", window: ["-60m", "0m"], total: 300}
  - name: thumb_batch_429
    endpoint_template: thumbnails.roblox.com/v1/batch
    method: POST
    window: ["-14m", "-4m"]
    total: 4
    egress: direct
    outcome: failed
    reason: upstream_cooldown
    status: 429
    source: roxy
    cache_state: "OFF"
    upstream_status: 429
    upstream_calls: 1
    error: true
    upstream_429: {egress: direct, retry_after_s: 15}
  - {name: user_miss, profile: miss, endpoint_template: "users.roblox.com/v1/users/{userId}", window: ["-60m", "0m"], total: 400}
  - {name: user_429, profile: stale_429, endpoint_template: "users.roblox.com/v1/users/{userId}", window: ["-13m", "-1m"], total: 9}

expect:
  data_checks:
    - window: ["-15m", "0m"]
      where: {host: games.roblox.com}
      roblox_429: 18
    - window: ["-15m", "0m"]
      where: {endpoint_template: "games.roblox.com/v1/games/{gameId}/favorites/count"}
      roblox_429: 0
    - window: ["-25m", "-15m"]
      where: {endpoint_template: "games.roblox.com/v1/games/{gameId}/favorites/count"}
      roblox_429: 5
    - window: ["-15m", "0m"]
      where: {host: thumbnails.roblox.com}
      roblox_429: 10
    - window: ["-15m", "0m"]
      where: {host: users.roblox.com}
      roblox_429: 9

  fires: false

variants:
  - case: window_25_includes_third_template
    description: A 25 minute window holds the older favorites/count 429s, so games.roblox.com has three templates.
    settings: {insight_up_429_host_window_min: 25}
    expect:
      fires: true
      others: forbid
      recommendations:
        - subject_contains: "games.roblox.com"
          changes_required:
            - {kind: bucket_override, bucket_key: "host:games.roblox.com", proposed: {per_min: {lt: 240}}}
  - case: min_templates_2
    description: With a minimum of two templates, games and thumbnails fire; users (one template) stays quiet.
    settings: {insight_up_429_host_min_templates: 2}
    expect:
      fires: true
      others: forbid
      recommendations:
        - {subject_contains: "games.roblox.com"}
        - {subject_contains: "thumbnails.roblox.com"}
