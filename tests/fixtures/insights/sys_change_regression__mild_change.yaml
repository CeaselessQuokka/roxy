# SYS-CHANGE-REGRESSION just under its threshold (worse by more than 25%).
#
# 20 minutes ago the default cache TTL went from 120 s to 100 s. A few more requests miss, and the metrics moved a
# little, all under 25%:
#
#   metric                          baseline (12:40 to 14:40)   since the change (14:40 to 15:00)   change
#   Roblox 429s per upstream call   30 / 4,830 = 0.621%         6 / 846 = 0.709%                    +14%
#   Roblox 429s per minute          0.25                        0.30                                +20%
#   caller errors per request       30 / 12,030 = 0.249%        6 / 2,006 = 0.299%                  +20%
#   p95 latency                     same distributions; the hit share moves from 60% to 58%         about +1%
#
# The variant lowers the threshold to 10%, under the 429 and error changes, and the rule must then recommend the
# revert (cache_ttl_seconds 100 -> 120).

format: roxy.insight_fixture/1
rule: SYS-CHANGE-REGRESSION
case: mild_change
description: >
  A small TTL change 20 minutes ago moved the 429 and error rates up by 14% to 20%, under the 25% threshold.
  SYS-CHANGE-REGRESSION must not fire; with a 10% threshold it must recommend the revert.
now: "2026-10-07T15:00:00Z"

settings:
  cache_ttl_seconds: 100

traffic_defaults:
  auth_class: anon
  bypass: false
  error: false
  endpoint_template: games.roblox.com/v1/games
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]
  user_agent: "Roblox/Linux"

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", upstream_calls: 0, latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", upstream_calls: 1, latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1800, upstream_in: 1900, upstream_out: 420}}
  roblox_429:
    egress: direct
    outcome: failed
    reason: upstream_cooldown
    status: 429
    source: roxy
    cache_state: "MISS"
    upstream_status: 429
    upstream_calls: 1
    error: true
    latency_ms: {p50: 90, p95: 220, p99: 400}
    bytes: {caller_in: 0, caller_out: 75, upstream_in: 150, upstream_out: 420}
    upstream_429: {egress: direct, retry_after_s: 30}

traffic:
  - {name: before_hit, profile: hit, window: ["-140m", "-20m"], per_minute: 60}
  - {name: before_miss, profile: miss, window: ["-140m", "-20m"], per_minute: 40}
  - {name: before_429, profile: roblox_429, window: ["-140m", "-20m"], total: 30}
  - {name: after_hit, profile: hit, window: ["-20m", "0m"], per_minute: 58}
  - {name: after_miss, profile: miss, window: ["-20m", "0m"], per_minute: 42}
  - {name: after_429, profile: roblox_429, window: ["-20m", "0m"], total: 6}

state:
  settings_history:
    - {at: "-20m", key: cache_ttl_seconds, old: 120, new: 100, source: admin, changed_by: admin, reason: "Slightly fresher lobby data."}

expect:
  data_checks:
    - {window: ["-140m", "-20m"], requests: 12030, upstream_calls: 4830, roblox_429: 30}
    - {window: ["-20m", "0m"], requests: 2006, upstream_calls: 846, roblox_429: 6}
  fires: false

variants:
  - case: worse_pct_lowered
    description: At 10%, the +14% to +20% moves in 429s and errors count as a regression.
    settings: {insight_sys_change_regression_worse_pct: 10}
    expect:
      fires: true
      others: forbid
      recommendations:
        - safe_auto: false
          changes_required:
            - {kind: setting, key: cache_ttl_seconds, current: 100, proposed: 120}
