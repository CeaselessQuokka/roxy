# CACHE-KEYSPLIT stays quiet when each split group misses one threshold by a little
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "v1 Suspect rule (>= 5 entries, top param >= 80% distinct, hits <= 10%)"
# (insight_cache_keysplit_min_entries 5, _distinct_pct 80, _max_hit_pct 10).
#
#   group                                  entries  top parameter  distinct      hits        misses
#   GET games.roblox.com/v1/games/votes          4  `_`            4 (100%)      0           entries (>= 5)
#   GET catalog.roblox.com/v1/search/items      24  `t`            19 (79.2%)    0           distinct (>= 80%)
#   GET games.roblox.com/v1/games               10  `cb`           10 (100%)     2 (20%)     hits (<= 10%)
#
# All three parameters are cache busters (a timestamp, a minute stamp that some callers share, a random number),
# so when a variant moves a threshold past the data, ignoring that parameter is the right fix. In the search
# group five entries repeat a `t` value and differ only in `limit` (10 instead of 30), which is why only 19 of
# the 24 `t` values are distinct.

format: roxy.insight_fixture/1
rule: CACHE-KEYSPLIT
case: below_thresholds
description: >
  Three cache-busted groups, each just inside one of the three v1 Suspect limits: 4 entries, 79% distinct, 20%
  hits. Nothing may fire at the defaults; each variant fires exactly the group next to the threshold it moves,
  with that group's busting parameter as the ignored parameter.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  rules_cache:
    - {id: 1, pattern: "games.roblox.com/v1/games/votes", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 2, pattern: "catalog.roblox.com/v1/search/items", type: glob, ttl: 120, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 4, pattern: "games.roblox.com/v1/games", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}

traffic_defaults:
  auth_class: anon
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1800, upstream_in: 1900, upstream_out: 420}}

traffic:
  - {name: votes_miss, profile: miss, endpoint_template: games.roblox.com/v1/games/votes, window: ["-15m", "0m"], total: 4}
  - {name: search_miss, profile: miss, endpoint_template: catalog.roblox.com/v1/search/items, window: ["-20m", "0m"], total: 24}
  - {name: games_hit, profile: hit, endpoint_template: games.roblox.com/v1/games, window: ["-15m", "0m"], total: 2}
  - {name: games_miss, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-15m", "0m"], total: 10}

