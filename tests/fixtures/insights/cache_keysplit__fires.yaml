expect:
  data_checks:
    - window: ["-60m", "0m"]
      where: {endpoint_template: games.roblox.com/v1/games/votes}
      requests: 1200
      served_cache: 60

  fires: true
  others: forbid
  recommendations:
    - rule_id: CACHE-KEYSPLIT
      subject_contains: "games.roblox.com/v1/games/votes"
      severity: any
      family: cache
      confidence: high
      change_kinds_required: [ignored_param_add]
      change_kinds_forbidden: [ban_add, filter_add, bypass_add, tarpit_category, credential_allowlist_remove, routing_rule, host_add, bucket_override]
      changes_required:
        - {kind: ignored_param_add, proposed: {name: "_"}}
      changes_forbidden:
        - {kind: ignored_param_add, proposed: {name: {ne: "_"}}}
        - kind: setting
          key: {in: [cache_ttl_seconds, cache_swr_seconds, cache_max_entries, cache_max_bytes, cache_enabled, cache_respect_no_cache]}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_cache_keysplit_enabled: 0}
    expect: {fires: false}
  - case: min_entries_13
    description: Thirteen entries needed; the votes group has twelve.
    settings: {insight_cache_keysplit_min_entries: 13}
    expect: {fires: false}
  - case: max_hit_pct_5
    description: At most 5% hits allowed; the votes group has one hit in twelve entries (8.3%).
    settings: {insight_cache_keysplit_max_hit_pct: 5}
    expect: {fires: false}
  - case: severity_override_warn
    description: insight_cache_keysplit_severity replaces the computed severity.
    settings: {insight_cache_keysplit_severity: warn}
    expect:
      fires: true
      recommendations:
        - {subject_contains: "games.roblox.com/v1/games/votes", severity: warn}
