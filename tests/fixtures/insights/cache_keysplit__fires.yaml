# CACHE-KEYSPLIT fires on the v1 Suspect pattern: one parameter makes every cache entry unique
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "v1 Suspect rule (>= 5 entries, top param >= 80% distinct, hits <= 10%) or SPAM-BUST"; evidence
# "Param, distinct ratio, sample values (truncated)"; change "Add ignored param (one click), or normalization rule
# (sort id lists)"; confidence High. Thresholds: insight_cache_keysplit_min_entries 5, _distinct_pct 80,
# _max_hit_pct 10.
#
# The v1 rule (.remake/v1notes/cache.md section 19) groups cache entries by method and path without the query,
# finds the parameter with the most distinct values, and flags the group when entries >= 5, that parameter's
# distinct values >= 80% of the entries, and the group's total hits <= 10% of the entries.
#
#   group                        entries  top parameter       distinct  hits          verdict
#   GET games.roblox.com/v1/games/votes   12  `_` (timestamp)   12 (100%)  1 (8.3%)   split -> ignore `_`
#   GET games.roblox.com/v1/games         10  universeIds       10 (100%)  379        reused, fine
#   GET groups.roblox.com/v2/groups        8  groupIds           8 (100%)   17        reused, fine
#
# Only `_` may be ignored: universeIds and groupIds select different answers.

format: roxy.insight_fixture/1
rule: CACHE-KEYSPLIT
case: fires
description: >
  Callers of games.roblox.com/v1/games/votes add a unique `_` timestamp to every request, so its twelve cache
  entries are all different and almost never hit. The rule must propose ignoring `_` for that group, and must not
  touch the id parameters of the two healthy groups, whose entries are reused.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  rules_cache:
    - {id: 1, pattern: "games.roblox.com/v1/games/votes", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 4, pattern: "games.roblox.com/v1/games", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 5, pattern: "groups.roblox.com/v2/groups", type: glob, ttl: 600, methods: "GET", origin: admin, created_at: "-40d"}

traffic_defaults:
  auth_class: anon
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1800, upstream_in: 1900, upstream_out: 420}}

traffic:
