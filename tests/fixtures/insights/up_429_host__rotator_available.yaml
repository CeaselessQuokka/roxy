# UP-429-HOST with a healthy rotator that is well within its quota (format: README.md in this directory).
#
# 11.5: "Lower the host bucket; shift share to rotator if healthy and within quota". Same 429 pattern as
# up_429_host__three_templates (three games.roblox.com templates in 15 minutes), but here:
#
#   rotator enabled, quota 20 GB per month, billing day 1   settings
#   2.1 GB used this cycle (10.5%)                          state.egress.usage, 300 MB per day since 2026-10-01
#   rotator healthy: 240 calls in the last hour, no 429s    rotator_* generators (used while direct cooled down)
#
# so the recommendation must lower host:games.roblox.com AND shift share to the rotator. 11.5 does not say how;
# either a `prefer_rotator` routing rule covering the games endpoints or a higher `rotator_weight` passes.
# "Never onto credential" (7.9) applies: no credential change of any kind.

format: roxy.insight_fixture/1
rule: UP-429-HOST
case: rotator_available
description: >
  Roblox rate-limits three games.roblox.com endpoints within 15 minutes while the rotator, enabled with a 20 GB
  monthly quota of which 10.5% is used, answered all of its 240 calls in the last hour without a 429. The rule
  must lower the games.roblox.com host bucket and shift share to the rotator; if the rotator is switched off or
  out of quota (variants), the shift must not be proposed.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

settings:
  adaptive_rate_enabled: 0
  rotator_enabled: 1
  rotator_weight: 0
  rotator_quota_gb_per_month: 20
  rotator_billing_day: 1

tables:
  rules_cache:
    - {id: 1, pattern: "games.roblox.com/v1/games", type: glob, ttl: 120, stale_ttl: 60, methods: "GET", origin: admin, created_at: "-30d"}

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004"]

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: {p50: 3, p95: 9, p99: 20}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 150, p95: 400, p99: 800}}
  rotator_miss:
    egress: rotator
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "MISS"
    latency_ms: {p50: 420, p95: 900, p99: 1400}
    bytes: {caller_in: 0, caller_out: 1500, upstream_in: 7600, upstream_out: 1100}
  stale_429:
    egress: direct
    outcome: served_cache
    reason: cache_stale_error
    status: 200
    source: cache
    cache_state: "STALE"
    upstream_status: 429
    upstream_calls: 1
    error: true
    latency_ms: {p50: 90, p95: 200, p99: 350}
    upstream_429: {egress: direct, retry_after_s: 15}

traffic:
  - {name: games_list_hit, profile: hit, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 1000}
  - {name: games_list_miss, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 600}
  - {name: games_list_429, profile: stale_429, endpoint_template: games.roblox.com/v1/games, window: ["-12m", "-3m"], total: 14}
  - {name: votes_miss, profile: miss, endpoint_template: games.roblox.com/v1/games/votes, window: ["-60m", "0m"], total: 500}
  - {name: votes_429, profile: stale_429, endpoint_template: games.roblox.com/v1/games/votes, window: ["-12m", "-3m"], total: 9}
  - {name: favorites_miss, profile: miss, endpoint_template: "games.roblox.com/v1/games/{gameId}/favorites/count", window: ["-60m", "0m"], total: 300}
  - {name: favorites_429, profile: stale_429, endpoint_template: "games.roblox.com/v1/games/{gameId}/favorites/count", window: ["-12m", "-3m"], total: 4}
  # The rotator carried games traffic while the direct path cooled down, and some thumbnails traffic earlier.
  - {name: rotator_games, profile: rotator_miss, endpoint_template: games.roblox.com/v1/games, window: ["-4m", "-2m"], total: 60}
  - {name: rotator_headshot, profile: rotator_miss, endpoint_template: thumbnails.roblox.com/v1/users/avatar-headshot, window: ["-60m", "-30m"], total: 180}

state:
  cooldowns:
    - {key: "host:games.roblox.com:direct", until: "-2m", source: retry_after, set_at: "-4m", hits: 3}
  egress:
    usage:
      - {egress: rotator, granularity: day, at: "2026-10-01", requests: 40000, req_bytes: 30000000, resp_bytes: 250000000, overhead_bytes: 20000000}
      - {egress: rotator, granularity: day, at: "2026-10-02", requests: 40000, req_bytes: 30000000, resp_bytes: 250000000, overhead_bytes: 20000000}
      - {egress: rotator, granularity: day, at: "2026-10-03", requests: 40000, req_bytes: 30000000, resp_bytes: 250000000, overhead_bytes: 20000000}
      - {egress: rotator, granularity: day, at: "2026-10-04", requests: 40000, req_bytes: 30000000, resp_bytes: 250000000, overhead_bytes: 20000000}
      - {egress: rotator, granularity: day, at: "2026-10-05", requests: 40000, req_bytes: 30000000, resp_bytes: 250000000, overhead_bytes: 20000000}
      - {egress: rotator, granularity: day, at: "2026-10-06", requests: 40000, req_bytes: 30000000, resp_bytes: 250000000, overhead_bytes: 20000000}
      - {egress: rotator, granularity: day, at: "2026-10-07", requests: 40000, req_bytes: 30000000, resp_bytes: 250000000, overhead_bytes: 20000000}
  settings_history:
    - {at: "-30d", key: adaptive_rate_enabled, old: 1, new: 0, source: admin, changed_by: admin, reason: "Hold bucket rates steady during the cutover."}
    - {at: "-20d", key: rotator_quota_gb_per_month, old: 0, new: 20, source: admin, changed_by: admin, reason: "Plan purchased."}

expect:
  data_checks:
    - window: ["-15m", "0m"]
      where: {host: games.roblox.com}
      roblox_429: 27
    - window: ["-60m", "0m"]
      where: {egress: rotator}
      requests: 240
      upstream_calls: 240
      roblox_429: 0

  fires: true
  others: forbid
  recommendations:
    - subject_contains: "games.roblox.com"
      confidence: medium
      family: upstream
      change_kinds_required: [bucket_override]
      change_kinds_forbidden: [credential_allowlist_remove, ban_add, filter_add]
      changes_required:
        - kind: bucket_override
          bucket_key: "host:games.roblox.com"
          current: {per_min: 240}
          proposed: {per_min: {lt: 240, gte: 1}}
        - any_of:
            - kind: routing_rule
              match: {pattern: {matches_targets: ["games.roblox.com/v1/games"]}}
              proposed: {mode: prefer_rotator}
            - {kind: setting, key: rotator_weight, current: 0, proposed: {gt: 0}}
      changes_forbidden:
        - kind: bucket_override
          bucket_key: {ne: "host:games.roblox.com"}
        - kind: setting
          key: {in: [host_bucket_default_per_min, endpoint_bucket_default_per_min, global_bucket_per_min, direct_bucket_per_min, rotator_quota_gb_per_month, rotator_hard_stop_pct]}
        - kind: routing_rule
          proposed: {mode: {in: [rotator_only, direct_only]}}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_up_429_host_enabled: 0}
    expect: {fires: false}
  - case: rotator_switched_off
    description: With the rotator switched off, only the host bucket may change.
    settings: {rotator_enabled: 0}
    expect:
      fires: true
      others: forbid
      recommendations:
        - subject_contains: "games.roblox.com"
          change_kinds_forbidden: [routing_rule]
          changes_required:
            - {kind: bucket_override, bucket_key: "host:games.roblox.com", proposed: {per_min: {lt: 240}}}
          changes_forbidden:
            - {kind: setting, key: rotator_weight}
  - case: rotator_over_quota
    description: >
      With the quota lowered to 1.5 GB, the 2.1 GB (1.96 GiB) already used this cycle puts the rotator over
      quota whichever unit is used, so share must not shift to it; the host bucket is still lowered.
    settings: {rotator_quota_gb_per_month: 1.5}
    expect:
      fires: true
      others: forbid
      recommendations:
        - subject_contains: "games.roblox.com"
          change_kinds_forbidden: [routing_rule]
          changes_required:
            - {kind: bucket_override, bucket_key: "host:games.roblox.com", proposed: {per_min: {lt: 240}}}
          changes_forbidden:
            - {kind: setting, key: rotator_weight}
