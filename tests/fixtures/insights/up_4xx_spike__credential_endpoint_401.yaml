# UP-4XX-SPIKE on an allowlisted credential endpoint that starts answering 401 (format: README.md here).
#
# 11.5: "if a credential endpoint returns 401: remove it from the allowlist and check the credential". The
# credential itself is fine (the scheduled probe at -20m answered 200 for the same account), so the 401s belong
# to this endpoint, not to the account. The allowlist removal is required; anything about the credential is a
# manual check (never an automatic switch, plan C1), and the recommendation is not safe_auto.
#
#   template (allowlisted, credential path)               7-day baseline   last 30 minutes
#   economy.roblox.com/v1/assets/{assetId}/resellers      0% 401           150 x 401 of 180 calls (83%)
#
# Callers get the relayed 401 (7.13 first row). 150 >= 20 rejections, 180 >= 100 calls, 83% > 3 x 0%.

format: roxy.insight_fixture/1
rule: UP-4XX-SPIKE
case: credential_endpoint_401
description: >
  An allowlisted endpoint called with the credential has answered 401 to 150 of its 180 calls in the last 30
  minutes, after a week without a single 401, while the credential's own probe still succeeds. The rule must
  recommend removing that endpoint (and only that one) from the credential allowlist, not as safe_auto.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  credential_allowlist:
    - {id: 1, pattern: "economy.roblox.com/v1/assets/*/resellers", type: glob, methods: "GET", cache_private: 1, identical_anonymous: 0, created_at: "-40d", created_by: admin}
    - {id: 2, pattern: "economy.roblox.com/v2/users/*/transactions", type: glob, methods: "GET", cache_private: 1, identical_anonymous: 0, created_at: "-40d", created_by: admin}

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "198.51.100.0/27", count: 12}
  places: ["1000000011", "1000000012"]
  endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers"
  egress: credential
  auth_class: cred
  outcome: served_upstream
  source: relay
  cache_state: "OFF"
  latency_ms: {p50: 220, p95: 600, p99: 1100}

profiles:
  ok: {reason: upstream_ok, status: 200}
  r401: {reason: upstream_4xx, status: 401, latency_ms: {p50: 120, p95: 300, p99: 500}}
  tx: {endpoint_template: "economy.roblox.com/v2/users/{userId}/transactions"}

traffic:
  - {name: resellers_ok_base, profile: ok, window: ["-7d", "-30m"], per_minute: 2}
  - {name: tx_ok_base, profile: [tx, ok], window: ["-7d", "-30m"], per_minute: 1}
  - {name: resellers_ok_recent, profile: ok, window: ["-30m", "0m"], per_minute: 1}
  - {name: resellers_401_recent, profile: r401, window: ["-30m", "0m"], per_minute: 5}
  - {name: tx_ok_recent, profile: [tx, ok], window: ["-30m", "0m"], per_minute: 1}

events:
  internal_calls:
    - {at: "-50m", purpose: credential_probe, trigger: scheduled, egress: credential, endpoint_template: users.roblox.com/v1/users/authenticated, status: 200}
    - {at: "-20m", purpose: credential_probe, trigger: scheduled, egress: credential, endpoint_template: users.roblox.com/v1/users/authenticated, status: 200}

state:
  credential:
    present: true
    status: active
    status_at: "-60d"
    set_at: "-60d"
    account_id: "1000009999"
    probes:
      - {at: "-50m", kind: scheduled, status: 200, result: ok}
      - {at: "-29m", kind: confirm_401, status: 200, result: ok}    # 7.9: one confirming probe after a 401
      - {at: "-20m", kind: scheduled, status: 200, result: ok}

expect:
  data_checks:
    - window: ["-30m", "0m"]
      where: {endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers"}
      upstream_calls: 180
      by_reason: {upstream_4xx: 150}
    - window: ["-7d", "-30m"]
      where: {endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers", status: 401}
      requests: 0

  fires: true
  others: forbid
  recommendations:
    - subject_contains: "economy.roblox.com/v1/assets/{assetId}/resellers"
      confidence: medium
      family: upstream
      safe_auto: false
      change_kinds_required: [credential_allowlist_remove]
      change_kinds_forbidden: [routing_rule, bucket_override, ban_add]
      changes_required:
        - kind: credential_allowlist_remove
          match:
            pattern:
              matches_targets: ["economy.roblox.com/v1/assets/2000000001/resellers"]
      changes_forbidden:
        - kind: credential_allowlist_remove
          match:
            pattern:
              matches_targets: ["economy.roblox.com/v2/users/1000000001/transactions"]
        - {kind: setting, key: {in: [credential_enabled, credential_bucket_per_min, credential_probe_interval_min]}}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_up_4xx_spike_enabled: 0}
    expect: {fires: false}
  - case: min_responses_151
    description: 150 rejections are one short of a minimum of 151 ("at least" N responses).
    settings: {insight_up_4xx_spike_min_responses: 151}
    expect: {fires: false}
  - case: min_responses_150
    description: 150 rejections meet a minimum of 150.
    settings: {insight_up_4xx_spike_min_responses: 150}
    expect:
      fires: true
      others: forbid
      recommendations:
        - {subject_contains: "economy.roblox.com/v1/assets/{assetId}/resellers"}
