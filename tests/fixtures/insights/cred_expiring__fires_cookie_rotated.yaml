# CRED-EXPIRING fires when Roblox answers with a warning that the credential is being replaced
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "Probe 401/403, or account warning in response"; change "Manual: renew credential (never
# auto-switch)".
#
# Reading of "account warning in response" (report to the lead if the rule author disagrees): the only account
# warning Roxy detects in a Roblox response today is a new credential cookie in `Set-Cookie`
# (egress/credential.py observe_set_cookie: "Roblox sent a new credential cookie ...; not stored (C1)"), which
# means Roblox is rotating the cookie and the stored one will stop working. It is recorded as a
# `credential_rotated` event (severity critical) and an audit row.
#
#   Probes are all fine (the stored cookie still works), status active. 20 minutes ago a probe response carried a
#   replacement cookie. Roxy did not store it and must never switch to it by itself (plan C1).

format: roxy.insight_fixture/1
rule: CRED-EXPIRING
case: fires_cookie_rotated
description: >
  The credential still passes its probes, but Roblox sent a replacement credential cookie twenty minutes ago,
  which Roxy recorded and did not store. The rule must fire with a manual "renew the credential" change and no
  automatic change of any kind.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

state:
  credential:
    present: true
    status: active
    status_at: "-40d"
    set_at: "-40d"
    account_id: "1000001"
    probes:
      - {at: "-80m", kind: liveness, status: 200, result: ok}
      - {at: "-50m", kind: liveness, status: 200, result: ok}
      - {at: "-20m", kind: liveness, status: 200, result: ok}

events:
  security:
    - at: "-20m"
      type: credential_rotated
      severity: critical
      reason_code: credential
      detail: {endpoint: users.roblox.com/v1/users/authenticated}

expect:
  fires: true
  others: forbid
  recommendations:
    - rule_id: CRED-EXPIRING
      severity: any
      family: credential
      confidence: high
      safe_auto: false
      change_kinds_required: [manual]
      change_kinds_forbidden: [setting, bucket_override, rule_upsert, rule_delete, filter_add, filter_remove, ban_add, ban_remove, bypass_add, bypass_remove, ignored_param_add, tarpit_category, routing_rule, credential_allowlist_remove, host_add]

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_cred_expiring_enabled: 0}
    expect: {fires: false}
