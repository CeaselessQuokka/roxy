# UP-4XX-SPIKE where only the anonymous path fails (format: README.md in this directory).
#
# 11.5: "If only anonymous fails and the template works on the credential path: owner decision on the credential
# allowlist (manual, never automatic)". The evidence column asks for an "anonymous vs credential path comparison
# for the same template". The template is not on the allowlist, so the only credential calls to it are the
# admin's own lookups from the dashboard (events.internal_calls, purpose admin_lookup, egress credential), and
# those succeed:
#
#   template                                                  anonymous, last 30 min      credential (admin lookups)
#   inventory.roblox.com/v1/users/{userId}/can-view-inventory 400 x 401 of 450 calls      6 calls, all 200
#                                                             (7-day baseline 0%)
#
# So the change must be `manual` (the owner decides about the allowlist), the recommendation is not safe_auto,
# and it must not block the endpoint or negative-cache it (that is the "both fail" branch), nor touch the
# credential allowlist itself.

format: roxy.insight_fixture/1
rule: UP-4XX-SPIKE
case: anonymous_only_works_with_credential
description: >
  Roblox started requiring a login for an inventory visibility endpoint: anonymous calls now get 401, while
  the admin's lookups of the same endpoint with the credential still succeed. The rule must leave the decision
  to the owner (a manual change only), never block or negative-cache the endpoint, and never be safe_auto.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003"]
  endpoint_template: "inventory.roblox.com/v1/users/{userId}/can-view-inventory"
  egress: direct
  outcome: served_upstream
  source: relay
  cache_state: "MISS"
  latency_ms: {p50: 140, p95: 380, p99: 700}

profiles:
  ok: {reason: upstream_ok, status: 200}
  r401: {reason: upstream_4xx, status: 401}

traffic:
  - {name: civ_ok_base, profile: ok, window: ["-7d", "-30m"], per_minute: 2}
  - {name: civ_ok_recent, profile: ok, window: ["-30m", "0m"], total: 50}
  - {name: civ_401_recent, profile: r401, window: ["-30m", "0m"], total: 400}

events:
  internal_calls:
    - {window: ["-25m", "-19m"], total: 6, purpose: admin_lookup, trigger: admin, egress: credential, endpoint_template: "inventory.roblox.com/v1/users/{userId}/can-view-inventory", status: 200}

state:
  credential:
    present: true
    status: active
    status_at: "-60d"
    set_at: "-60d"
    account_id: "1000009999"
    probes:
      - {at: "-40m", kind: scheduled, status: 200, result: ok}

expect:
  data_checks:
    - window: ["-30m", "0m"]
      upstream_calls: 450
      by_reason: {upstream_4xx: 400}
    - window: ["-7d", "-30m"]
      by_reason: {upstream_4xx: 0}

  fires: true
  others: forbid
  recommendations:
    - subject_contains: "inventory.roblox.com/v1/users/{userId}/can-view-inventory"
      confidence: medium
      family: upstream
      safe_auto: false
      change_kinds_required: [manual]
      change_kinds_forbidden: [credential_allowlist_remove, setting, routing_rule, bucket_override, ban_add, filter_add]
      changes_forbidden:
        - {kind: rule_upsert, table: rules_endpoint_block}
        - {kind: rule_upsert, table: credential_allowlist}
        - kind: rule_upsert
          table: rules_cache
          proposed: {negative_ttl: {gte: 1}}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_up_4xx_spike_enabled: 0}
    expect: {fires: false}
  - case: min_calls_460
    description: 450 caller calls in the window (456 with the admin lookups) are below a minimum of 460.
    settings: {insight_up_4xx_spike_min_calls: 460}
    expect: {fires: false}
