expect:
  data_checks:
    - window: ["-60m", "0m"]
      requests: 19900
      upstream_calls: 7465
      served_cache: 12435
      refused: 0
      failed: 0
    - window: ["-60m", "0m"]
      where: {endpoint_template: games.roblox.com/v1/games/votes}
      requests: 3000
      served_cache: 360
      upstream_calls: 2640
    - window: ["-60m", "0m"]
      where: {endpoint_template: "avatar.roblox.com/v1/users/{userId}/avatar"}
      requests: 300
      served_cache: 15

  fires: true
  others: forbid
  recommendations:
    - rule_id: CACHE-LOW-HIT
      subject_contains: "games.roblox.com/v1/games/votes"
      severity: any
      family: cache
      confidence: high          # "High if key split detected"
      evidence:
        metrics:
          cache_hit_ratio: {between: [0.11, 0.13]}
      change_kinds_required: [ignored_param_add]
      change_kinds_forbidden: [ban_add, filter_add, bypass_add, tarpit_category, credential_allowlist_remove, routing_rule, host_add, bucket_override]
      changes_required:
        - {kind: ignored_param_add, proposed: {name: "_"}}
      changes_forbidden:
        # The real id parameter must never be ignored: different universeIds are different answers.
        - {kind: ignored_param_add, proposed: {name: {ne: "_"}}}
        # Endpoint problem, so no global cache default changes.
        - kind: setting
          key: {in: [cache_ttl_seconds, cache_swr_seconds, cache_stale_seconds, cache_max_entries, cache_max_bytes, cache_enabled, cache_respect_no_cache]}
        - {kind: setting, key: cache_post_requests, proposed: "all"}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_cache_low_hit_enabled: 0}
    expect: {fires: false}
  - case: max_hit_ratio_below_evidence
    description: With the hit ratio threshold at 10%, the votes endpoint (12%) no longer counts as low-hit.
    settings: {insight_cache_low_hit_max_hit_ratio_pct: 10}
    expect: {fires: false}
  - case: top_n_one
    description: Checking only the single busiest endpoint (headshots, 80%) finds nothing.
    settings: {insight_cache_low_hit_top_n: 1}
    expect: {fires: false}
  - case: top_n_twelve
    description: Checking the 12 busiest endpoints also reports the 12th, the avatar endpoint at 5%.
    settings: {insight_cache_low_hit_top_n: 12}
    expect:
      fires: true
      others: forbid
      recommendations:
        - {subject_contains: "games.roblox.com/v1/games/votes", severity: any, confidence: high}
        - {subject_contains: "avatar.roblox.com/v1/users/", severity: any}
  - case: severity_override_warn
    description: insight_cache_low_hit_severity replaces the computed severity.
    settings: {insight_cache_low_hit_severity: warn}
    expect:
      fires: true
      recommendations:
        - {subject_contains: "games.roblox.com/v1/games/votes", severity: warn}
