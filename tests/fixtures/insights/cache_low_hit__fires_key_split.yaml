# CACHE-LOW-HIT fires on a busy endpoint whose cache is split by a cache-busting parameter
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "Endpoint in top 10 by requests with hit ratio < 30% over 1 h"; evidence "Hit ratio, key spread, TTL";
# change "See CACHE-TTL-TUNE and CACHE-KEYSPLIT"; confidence "High if key split detected".
#
#   endpoint (last 60 min)                               requests  rank  hit ratio
#   thumbnails.roblox.com/v1/users/avatar-headshot          4,000     1    80%
#   games.roblox.com/v1/games/votes                         3,000     2    12%   <- the only recommendation
#   games.roblox.com/v1/games                               2,800     3    75%
#   ... seven more healthy endpoints (50% to 80%) ...                 4-11
#   avatar.roblox.com/v1/users/{userId}/avatar                300    12     5%   <- low, but not in the top 10
#
# Hit ratio is the metrics catalog definition: (HIT + STALE + REVALIDATING + COALESCED) / (those + MISS).
# The key spread is in cache.db: twelve fresh votes entries that differ only in a `_` timestamp parameter (12 of 12
# values distinct, 1 hit in total), which is the v1 Suspect pattern, so the key split is detected and the
# confidence is high. The fix for a busting parameter is to ignore it (CACHE-KEYSPLIT's change), never the real
# `universeIds` parameter, and never a global cache setting.

format: roxy.insight_fixture/1
rule: CACHE-LOW-HIT
case: fires_key_split
description: >
  games.roblox.com/v1/games/votes is the second busiest endpoint but only 12% of its requests are answered from
  the cache, because callers append a unique `_` timestamp to every URL. The cache entries show the split. The
  rule must report this endpoint only (the 5% avatar endpoint is 12th by requests, outside the top 10), with high
  confidence and the ignored parameter `_` as the change.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  rules_cache:
    - {id: 1, pattern: "games.roblox.com/v1/games/votes", type: glob, ttl: 300, stale_ttl: 60, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 2, pattern: "catalog.roblox.com/v1/search/items", type: glob, ttl: 120, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 3, pattern: "thumbnails.roblox.com/v1/users/avatar-headshot", type: glob, ttl: 600, stale_ttl: 120, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 4, pattern: "games.roblox.com/v1/games", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 5, pattern: "groups.roblox.com/v2/groups", type: glob, ttl: 600, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 6, pattern: "groups.roblox.com/v1/groups/*", type: glob, ttl: 600, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 7, pattern: "badges.roblox.com/v1/badges/*", type: glob, ttl: 3600, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 8, pattern: "users.roblox.com/v1/users/*", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}

traffic_defaults:
  auth_class: anon
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
