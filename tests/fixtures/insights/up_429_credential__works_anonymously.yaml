# UP-429-CREDENTIAL on an operation sent with the account that Roblox also answers without a sign-in
# (format: README.md here).
#
# 11.5: "Lower credential_bucket_per_min; remove the endpoint from the credential allowlist if it works
# anonymously". Owner decision D1 (revised 2026-10-16) replaced the allowlist with the endpoint policy
# (src/roxy/policy/endpoint_policy_seed.json): the second half is now a manual step on the Endpoint policy page,
# "set <operation> to 'Sent without an account'". The policy's grant says whether an operation works without the
# account: `identical_anonymous` is true when the seed row does not require a sign-in. So both changes are
# required: the lower credential bucket and the manual policy change for the limited operation.
#
#   fact                                                       where it comes from here
#   2 credential 429s in the last 5 minutes                    fav_429
#   games:GET:/v1/games/{universeId}/favorites/count           seed verdict ALLOW_TOKEN, no sign-in needed; the
#                                                              traffic names the placeholder {gameId}, which the
#                                                              policy matches all the same
#   inventory:GET:/v2/collectible-items/{collectibleItemId}/owners
#                                                              seed verdict ALLOW_TOKEN, sign-in needed, no 429s
#                                                              (must not get a change)

format: roxy.insight_fixture/1
rule: UP-429-CREDENTIAL
case: works_anonymously
description: >
  The endpoint policy sends a public operation (game favorite counts) with Roxy's account. Roblox now
  rate-limits the account on it, and Roblox answers that operation without a sign-in too. The rule must
  recommend both a lower credential_bucket_per_min and sending that operation (only that one) without the
  account, as a manual change on Endpoint policy; it is not safe_auto.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "198.51.100.0/27", count: 12}
  places: ["1000000011", "1000000012", "1000000013"]

profiles:
  fav_cred:
    endpoint_template: "games.roblox.com/v1/games/{gameId}/favorites/count"
    egress: credential
    auth_class: cred
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "MISS"
    latency_ms: {p50: 160, p95: 420, p99: 800}
  owners_cred:
    endpoint_template: "inventory.roblox.com/v2/collectible-items/{collectibleItemId}/owners"
    egress: credential
    auth_class: cred
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "OFF"
    latency_ms: {p50: 220, p95: 600, p99: 1100}

traffic:
  - {name: fav_ok, profile: fav_cred, window: ["-60m", "0m"], per_minute: 12}
  - name: fav_429
    profile: fav_cred
    window: ["-5m", "-3m"]
    per_minute: 1
    outcome: served_cache          # the answer is not private: a stale copy existed and was served
    reason: cache_stale_error
    source: cache
    cache_state: "STALE"
    upstream_status: 429
    error: true
    upstream_429: {egress: credential, retry_after_s: 60}
  - {name: fav_hit, profile: fav_cred, window: ["-60m", "0m"], per_minute: 20, egress: none, auth_class: anon, outcome: served_cache, reason: cache_hit, source: cache, cache_state: "HIT", latency_ms: 3}
  - {name: owners_ok, profile: owners_cred, window: ["-60m", "0m"], per_minute: 4}

state:
  credential:
    present: true
    status: active
    status_at: "-60d"
    set_at: "-60d"
    account_id: "1000009999"
    probes:
      - {at: "-40m", kind: scheduled, status: 200, result: ok}
  cooldowns:
    - {key: credential, until: "-2m", source: retry_after, set_at: "-3m", hits: 2}
  buckets:
    - bucket_key: "egress:credential"
      per_min: 20
      burst: 3
      fill_pct: 60
      history:
        - {window: ["-60m", "0m"], fill_pct_peak: 100, attempts: 962, rejections: 0}

expect:
  data_checks:
    - window: ["-60m", "0m"]
      where: {egress: credential}
      roblox_429: 2
      upstream_calls: 962
    - window: ["-60m", "0m"]
      roblox_429: 2

  fires: true
  others: forbid
  recommendations:
    - confidence: high
      family: upstream
      safe_auto: false
      change_kinds_required: [setting, manual]
      changes_required:
        - {kind: setting, key: credential_bucket_per_min, current: 20, proposed: {lt: 20, gte: 3}}
        - {kind: manual, text: {contains: "set games:GET:/v1/games/{universeId}/favorites/count to 'Sent without an account'"}}
      changes_forbidden:
        - {kind: manual, text: {contains: "collectible-items"}}
        - {kind: setting, key: credential_enabled}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_up_429_credential_enabled: 0}
    expect: {fires: false}
  - case: min_429s_3
    description: Two credential 429s are one short of a minimum of three.
    settings: {insight_up_429_credential_min_429s: 3}
    expect: {fires: false}
