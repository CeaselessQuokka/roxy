# UP-429-CREDENTIAL on an allowlisted endpoint that also works without the account (format: README.md here).
#
# 11.5: "Lower credential_bucket_per_min; remove the endpoint from the credential allowlist if it works
# anonymously". Here the allowlist row's `identical_anonymous` flag is 1: the CRED-UNUSED comparison (anonymous
# and credential calls to the same template returned the same body) already established that the endpoint works
# anonymously. So both changes are required: the lower credential bucket and the allowlist removal for that row.
#
#   fact                                                      where it comes from here
#   2 credential 429s in the last 5 minutes                   cred_429
#   allowlisted GET games.../games/{gameId}/favorites/count   tables.credential_allowlist id 3, identical_anonymous 1
#   a second allowlisted endpoint with no 429s, not identical tables.credential_allowlist id 4 (must stay)

format: roxy.insight_fixture/1
rule: UP-429-CREDENTIAL
case: works_anonymously
description: >
  Someone allowlisted a public endpoint (game favorite counts) for the credential. Roblox now rate-limits the
  account on it, and the allowlist row records that anonymous calls return the identical body. The rule must
  recommend both a lower credential_bucket_per_min and removing that endpoint (only that one) from the
  credential allowlist; it is not safe_auto.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  credential_allowlist:
    - {id: 3, pattern: "games.roblox.com/v1/games/*/favorites/count", type: glob, methods: "GET", cache_private: 0, identical_anonymous: 1, created_at: "-90d", created_by: import}
    - {id: 4, pattern: "economy.roblox.com/v1/assets/*/resellers", type: glob, methods: "GET", cache_private: 1, identical_anonymous: 0, created_at: "-40d", created_by: admin}

traffic_defaults:
  user_agent: "Roblox/Linux"
  clients: {cidr: "198.51.100.0/27", count: 12}
  places: ["1000000011", "1000000012", "1000000013"]

profiles:
  fav_cred:
    endpoint_template: "games.roblox.com/v1/games/{gameId}/favorites/count"
    egress: credential
    auth_class: cred
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "MISS"
    latency_ms: {p50: 160, p95: 420, p99: 800}
  resellers_cred:
    endpoint_template: "economy.roblox.com/v1/assets/{assetId}/resellers"
    egress: credential
    auth_class: cred
    outcome: served_upstream
    reason: upstream_ok
    status: 200
    source: relay
    cache_state: "OFF"
    latency_ms: {p50: 220, p95: 600, p99: 1100}

traffic:
  - {name: fav_ok, profile: fav_cred, window: ["-60m", "0m"], per_minute: 12}
  - name: fav_429
    profile: fav_cred
    window: ["-5m", "-3m"]
    per_minute: 1
    outcome: served_cache          # cache_private 0: a stale copy existed and was served
    reason: cache_stale_error
    source: cache
    cache_state: "STALE"
    upstream_status: 429
    error: true
    upstream_429: {egress: credential, retry_after_s: 60}
  - {name: fav_hit, profile: fav_cred, window: ["-60m", "0m"], per_minute: 20, egress: none, auth_class: anon, outcome: served_cache, reason: cache_hit, source: cache, cache_state: "HIT", latency_ms: 3}
  - {name: resellers_ok, profile: resellers_cred, window: ["-60m", "0m"], per_minute: 4}

state:
  credential:
    present: true
    status: active
    status_at: "-60d"
    set_at: "-60d"
    account_id: "1000009999"
    probes:
      - {at: "-40m", kind: scheduled, status: 200, result: ok}
  cooldowns:
    - {key: credential, until: "-2m", source: retry_after, set_at: "-3m", hits: 2}
  buckets:
    - bucket_key: "egress:credential"
      per_min: 20
      burst: 3
      fill_pct: 60
      history:
        - {window: ["-60m", "0m"], fill_pct_peak: 100, attempts: 962, rejections: 0}

expect:
  data_checks:
    - window: ["-60m", "0m"]
      where: {egress: credential}
      roblox_429: 2
      upstream_calls: 962
    - window: ["-60m", "0m"]
      roblox_429: 2

  fires: true
  others: forbid
  recommendations:
    - confidence: high
      family: upstream
      safe_auto: false
      change_kinds_required: [setting, credential_allowlist_remove]
      changes_required:
        - {kind: setting, key: credential_bucket_per_min, current: 20, proposed: {lt: 20, gte: 3}}
        - kind: credential_allowlist_remove
          match:
            pattern:
              matches_targets: ["games.roblox.com/v1/games/1000000001/favorites/count"]
      changes_forbidden:
        - kind: credential_allowlist_remove
          match:
            pattern:
              matches_targets: ["economy.roblox.com/v1/assets/2000000001/resellers"]
        - {kind: setting, key: credential_enabled}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_up_429_credential_enabled: 0}
    expect: {fires: false}
  - case: min_429s_3
    description: Two credential 429s are one short of a minimum of three.
    settings: {insight_up_429_credential_min_429s: 3}
    expect: {fires: false}
