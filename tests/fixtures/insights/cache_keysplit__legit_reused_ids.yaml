# CACHE-KEYSPLIT stays quiet on legitimate traffic whose id parameters vary but are reused
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: "v1 Suspect rule (>= 5 entries, top param >= 80% distinct, hits <= 10%) or SPAM-BUST".
#
#   group                                              entries  top parameter  distinct   hits
#   GET games.roblox.com/v1/games                          10   universeIds    10 (100%)  379 (3,790%)
#   GET groups.roblox.com/v2/groups                         8   groupIds        8 (100%)   17 (212%)
#   GET thumbnails.roblox.com/v1/users/avatar-headshot     10   userIds        10 (100%)  105 (1,050%)
#
# Every group has a parameter that is unique per entry, which is normal for id lookups; what makes them
# legitimate is that the entries are reused (hits far above 10%). A SPAM-ENUM detection (a client walking user
# ids) is also present: it is not SPAM-BUST, so it must not trigger this rule either.

format: roxy.insight_fixture/1
rule: CACHE-KEYSPLIT
case: legit_reused_ids
description: >
  Busy id lookups whose cache entries each hold a different id but are hit many times, plus an unrelated SPAM-ENUM
  detection. No group is split, so nothing may fire.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  rules_cache:
    - {id: 3, pattern: "thumbnails.roblox.com/v1/users/avatar-headshot", type: glob, ttl: 600, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 4, pattern: "games.roblox.com/v1/games", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 5, pattern: "groups.roblox.com/v2/groups", type: glob, ttl: 600, methods: "GET", origin: admin, created_at: "-40d"}

traffic_defaults:
  auth_class: anon
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1800, upstream_in: 1900, upstream_out: 420}}

traffic:
  - {name: games_hit, profile: hit, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 1200}
  - {name: games_miss, profile: miss, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], total: 300}
  - {name: groups_hit, profile: hit, endpoint_template: groups.roblox.com/v2/groups, window: ["-60m", "0m"], total: 600}
  - {name: groups_miss, profile: miss, endpoint_template: groups.roblox.com/v2/groups, window: ["-60m", "0m"], total: 300}
  - {name: headshot_hit, profile: hit, endpoint_template: thumbnails.roblox.com/v1/users/avatar-headshot, window: ["-60m", "0m"], total: 2400}
  - {name: headshot_miss, profile: miss, endpoint_template: thumbnails.roblox.com/v1/users/avatar-headshot, window: ["-60m", "0m"], total: 600}
  - name: user_walk
    profile: miss
    endpoint_template: "users.roblox.com/v1/users/{userId}"
    client_ip: "198.51.100.90"
    user_agent: "python-requests/2.32"
    window: ["-12m", "-2m"]
    per_minute: 64

events:
  security:
    - at: "-2m"
      type: spam_detected
      severity: info
      reason_code: spam
      ip: "198.51.100.90"
      detail:
        detector: SPAM-ENUM
        subject: "ip:198.51.100.90|users.roblox.com/v1/users/{userId}"
        value: 640
        threshold: 500
        window_s: 600
        action: recommend
        configured_action: recommend
        game_server: false
        evidence: "SPAM-ENUM: 640 in 600 s (threshold 500)"

state:
  cache:
