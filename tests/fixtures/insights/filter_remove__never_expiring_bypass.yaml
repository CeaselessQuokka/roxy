# FILTER-REMOVE, the "never-expiring" part of its bypass condition: "bypass entry unused 7 days OR never-expiring"
# (11.5). The idle threshold (insight_filter_remove_idle_bypass_days) does not apply to this part.
#
#   access_list entry                   expires    last hit     expected
#   198.51.100.40/32 "CI runner"        never      1 h ago      recommendation: set an expiry (or remove)
#   198.51.100.41/32 "uptime monitor"   in 5 d     2 min ago    none
#
# The CI runner is in active use, so 11.5's "remove or set expiry" is satisfied by either; SEC-BYPASS-FOREVER flags
# the same entry from the security side (its own fixtures). No other filter exists in this file.

format: roxy.insight_fixture/1
rule: FILTER-REMOVE
case: never_expiring_bypass
description: >
  A bypass entry with no expiry, used an hour ago, next to an expiring one in use. FILTER-REMOVE must raise one
  recommendation for the never-expiring entry, and raising the idle-bypass threshold must not silence it.
now: "2026-10-07T15:00:00Z"

tables:
  access_list:
    - {id: 1, kind: bypass, cidr: "198.51.100.40/32", note: "CI runner", expires_at: null, created_by: admin, created_at: "-45d", x_last_hit_at: "-1h"}
    - {id: 2, kind: bypass, cidr: "198.51.100.41/32", note: "Uptime monitor", expires_at: "+5d", created_by: admin, created_at: "-2d", x_last_hit_at: "-2m"}

traffic_defaults:
  auth_class: anon
  error: false

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", upstream_calls: 0, latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}

traffic:
  - {name: ci_runner, profile: hit, client_ip: "198.51.100.40", user_agent: "ci-smoke/3.1", bypass: true, endpoint_template: games.roblox.com/v1/games, window: ["-70m", "-60m"], per_minute: 20}
  - {name: monitor, profile: hit, client_ip: "198.51.100.41", user_agent: "uptime-probe/1.0", bypass: true, endpoint_template: games.roblox.com/v1/games, window: ["-60m", "0m"], per_minute: 1}

expect:
  data_checks:
    - {window: ["-70m", "0m"], requests: 260}

  fires: true
  others: forbid
  recommendations:
    - rule_id: FILTER-REMOVE
      subject_contains: "198.51.100.40"
      severity: any
      family: filter
      confidence: high
      exact_changes: true
      changes_required:
        - any_of:
            - {kind: rule_upsert, table: access_list, match: {kind: bypass, cidr: "198.51.100.40/32"}, proposed: {expires_at: {present: true}}}
            - {kind: bypass_add, proposed: {kind: bypass, cidr: "198.51.100.40/32", expires_at: {present: true}}}
            - {kind: bypass_remove, match: {kind: bypass, cidr: "198.51.100.40/32"}}
            - {kind: rule_delete, table: access_list, match: {kind: bypass, cidr: "198.51.100.40/32"}}

variants:
  - case: disabled
    description: The per-rule switch silences the rule.
    settings: {insight_filter_remove_enabled: 0}
    expect: {fires: false}
  - case: idle_bypass_days_raised
    description: >
      The idle threshold governs only unused entries; a never-expiring entry is flagged whatever it is set to (the
      no-threshold part of the condition), so raising it to 365 days changes nothing.
    settings: {insight_filter_remove_idle_bypass_days: 365}
    expect:
      fires: true
      others: forbid
      recommendations:
        - {subject_contains: "198.51.100.40"}
