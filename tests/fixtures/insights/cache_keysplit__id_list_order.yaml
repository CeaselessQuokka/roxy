expect:
  fires: true
  others: forbid
  recommendations:
    - rule_id: CACHE-KEYSPLIT
      subject_contains: "thumbnails.roblox.com/v1/users/avatar-headshot"
      severity: any
      family: cache
      safe_auto: false
      change_kinds_required: [rule_upsert]
      change_kinds_forbidden: [ignored_param_add, ban_add, filter_add, bypass_add, tarpit_category, routing_rule, host_add, bucket_override]
      changes_required:
        - kind: rule_upsert
          table: rules_cache
          match: {pattern: {matches_targets: ["thumbnails.roblox.com/v1/users/avatar-headshot"]}}
          proposed:
            normalize_flags: {contains: "sort_csv:userIds"}
      changes_forbidden:
        # The games rule (id 4) is a different endpoint whose entries are healthy.
        - {kind: rule_upsert, current: {id: 4}}
        - kind: setting
          key: {in: [cache_ttl_seconds, cache_swr_seconds, cache_max_entries, cache_max_bytes, cache_enabled]}

variants:
