    settings: {insight_cache_keysplit_enabled: 0}
    expect: {fires: false}
  - case: min_entries_9
    description: Nine entries needed; the headshot group has eight.
    settings: {insight_cache_keysplit_min_entries: 9}
    expect: {fires: false}
