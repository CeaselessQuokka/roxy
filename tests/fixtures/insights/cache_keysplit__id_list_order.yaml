# CACHE-KEYSPLIT proposes sorting an id list, not ignoring it, when the split comes from id order
# (format: tests/fixtures/insights/README.md).
#
# 11.5 row: change "Add ignored param (one click), or normalization rule (sort id lists)".
#
#   GET thumbnails.roblox.com/v1/users/avatar-headshot: 8 entries, 0 hits. The top parameter, userIds, has 8
#   distinct values (100%), so the v1 Suspect test flags the group. But the values are the same id sets in a
#   different order: six orders of {1000000401, 1000000402, 1000000403} and two of {1000000404, 1000000405}.
#   Sorted, they collapse to 2 values. userIds is a known id list parameter (config/defaults.py ID_LIST_PARAMS),
#   and `sort_csv:<param>` is the normalization flag of cache/keys.py.
#
# Ignoring userIds would serve one caller's thumbnails to another, so the fix is a normalization flag on the cache
# rule of that endpoint. Sorting changes the order of the list Roblox receives, and config/defaults.py marks this
# endpoint's sorting as unverified ("Needs a recorded response"), so the recommendation is never safe to apply
# automatically.

format: roxy.insight_fixture/1
rule: CACHE-KEYSPLIT
case: id_list_order
description: >
  The headshot endpoint's cache is split because callers list the same user ids in different orders. The rule
  must propose a sort_csv:userIds normalization on that endpoint's cache rule, must never propose ignoring
  userIds (or any other parameter), and must not mark it safe to auto-apply.
now: "2026-10-07T15:00:00Z"
seed_defaults: false

tables:
  rules_cache:
    - {id: 3, pattern: "thumbnails.roblox.com/v1/users/avatar-headshot", type: glob, ttl: 600, methods: "GET", origin: admin, created_at: "-40d"}
    - {id: 4, pattern: "games.roblox.com/v1/games", type: glob, ttl: 300, methods: "GET", origin: admin, created_at: "-40d"}

traffic_defaults:
  auth_class: anon
  user_agent: "Roblox/Linux"
  clients: {cidr: "203.0.113.0/26", count: 40}
  places: ["1000000001", "1000000002", "1000000003", "1000000004", "1000000005", "1000000006"]

profiles:
  hit: {egress: none, outcome: served_cache, reason: cache_hit, status: 200, source: cache, cache_state: "HIT", latency_ms: {p50: 3, p95: 9, p99: 20}, bytes: {caller_in: 0, caller_out: 1800}}
  miss: {egress: direct, outcome: served_upstream, reason: upstream_ok, status: 200, source: relay, cache_state: "MISS", latency_ms: {p50: 140, p95: 380, p99: 750}, bytes: {caller_in: 0, caller_out: 1800, upstream_in: 1900, upstream_out: 420}}

traffic:
