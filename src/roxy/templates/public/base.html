{#
	Shell of every public page (plan 16.1): head, site header, main, footer, and the one script.

	Strict CSP rules this file follows (plan 9.2): the only script is a <script type="module"> carrying this
	response's nonce, styles come only from the hashed stylesheet in /static (no style attributes, no <style>
	blocks), and nothing loads from another origin. Child templates fill the blocks `head` (title and meta tags),
	`head_extra` (data blocks such as JSON-LD), `main_class` and `content`.
#}
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		{% block head %}{% endblock %}
		<meta name="color-scheme" content="light dark" />
		<link rel="stylesheet" href="{{ static_url('public/site.css') }}" />
		<link rel="icon" type="image/png" href="{{ static_url('public/roxy_favicon.png') }}" />
		{% block head_extra %}{% endblock %}
	</head>
	<body>
		<a class="skip-link" href="#main">Skip to content</a>
		<header class="site-header">
			<div class="wrap bar">
				<a class="brand" href="/">Roxy Proxy</a>
				<nav class="site-nav" aria-label="Site">
					<a href="/"{% if page == "home" %} aria-current="page"{% endif %}>Home</a>
					<a href="/docs"{% if page == "docs" %} aria-current="page"{% endif %}>Guide</a>
					{% if status_enabled %}
					<a href="/status"{% if page == "status" %} aria-current="page"{% endif %}>Status</a>
					{% endif %}
				</nav>
			</div>
		</header>
		<main id="main" class="wrap{% block main_class %}{% endblock %}">
			{% block content %}{% endblock %}
		</main>
		{# One polite live region for the whole page: site.js writes "Code copied to clipboard." here, so screen
		reader users hear what sighted users see on the button (WCAG 4.1.3). Present from page load, because a
		live region added later is often not announced. #}
		<p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>
		<footer class="site-footer">
			<div class="wrap">
				<p><small>{{ footer_html }}</small></p>
				<p class="footer-links">
					<a href="/docs">User guide</a>
					{% if status_enabled %}
					<a href="/status">Status</a>
					{% endif %}
					<a href="/health">Health JSON</a>
				</p>
			</div>
		</footer>
		<script type="module" nonce="{{ csp_nonce }}" src="{{ static_url('public/site.js') }}"></script>
	</body>
</html>
