# /etc/nginx/sites-available/roxy
#
# Changes from the previous version are marked [CHANGED] / [ADDED] with the
# reason. Everything else is untouched, including the Certbot-managed TLS block.

# --- Redirect all HTTP traffic to HTTPS ---
server {
    listen 80;
    server_name roxytheproxy.com www.roxytheproxy.com;

    # Permanent redirect to HTTPS
    return 301 https://$host$request_uri;
}

# --- HTTPS server ---
server {
    listen 443 ssl;
    # [ADDED] HTTP/2. Roblox game servers open many small parallel requests;
    # multiplexing them over one connection cuts handshake overhead.
    http2 on;
    server_name roxytheproxy.com www.roxytheproxy.com;

    # SSL certificate configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/roxytheproxy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roxytheproxy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Enforce HTTPS-only access for 1 year.
    # nginx owns this header; the app is configured with ROXY_SEND_HSTS=0 so the
    # browser doesn't receive two copies (nginx's add_header appends, it does
    # not replace, so both would be sent).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # [ADDED] Match the app's MAX_CONTENT_LENGTH (2 MB). nginx defaults to 1 MB,
    # so a body between 1 and 2 MB was rejected here with a bare nginx 413 that
    # the app never saw and could not log or explain.
    client_max_body_size 2m;

    # [ADDED] Roblox sends no compressed request bodies and returns JSON, so
    # compress the responses we hand back to callers.
    gzip on;
    gzip_types application/json text/css application/javascript text/html;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # NOTE: $proxy_add_x_forwarded_for APPENDS the client's own
        # X-Forwarded-For (if it sent one) and then adds $remote_addr. So the
        # LAST entry is the only trustworthy one. The app reads it from the
        # right via ProxyFix with ROXY_TRUSTED_PROXY_HOPS=1 -- it used to read
        # the leftmost entry, which any caller could set to whatever they liked
        # to dodge rate limiting and the admin login lockout.
        #
        # If you would rather not forward the caller's claim at all, swap this
        # for `proxy_set_header X-Forwarded-For $remote_addr;` -- the app works
        # correctly either way with hops=1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # [ADDED] Keepalive to gunicorn. Without this nginx talks HTTP/1.0
        # upstream and opens a fresh TCP connection per request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # [ADDED] Timeouts that match the app instead of nginx's 60s default.
        # An upstream Roblox call can take request_timeout (15s) on each of up
        # to 3 methods, so a slow-but-succeeding request needs headroom past
        # 45s. gunicorn's own timeout is 90s, and nginx must not give up first
        # or the caller gets a 504 for a request that was still working.
        proxy_connect_timeout 10s;
        proxy_send_timeout 100s;
        proxy_read_timeout 100s;
    }

    # [ADDED] Health endpoint for uptime monitoring, kept out of the access log
    # so a 30-second monitor doesn't drown everything else. It reports the stats
    # file size, so an external monitor can alert on the metric that predicts
    # trouble without needing a session.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
